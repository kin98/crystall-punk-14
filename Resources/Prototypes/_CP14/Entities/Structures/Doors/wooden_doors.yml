- type: entity
  id: CE14WoodenDoor
  parent:
  - CE14BaseDoor
  - CE14BaseFlammableSpreading
  name: wooden door
  description: Not the most solid construction, but it's better than nothing.
  suffix: Opened
  components:
  - type: Sprite
    sprite: _CE14/Structures/Doors/wooden_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14WoodStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: CE14WoodenDoorFrame
  - type: Construction
    graph: CE14WoodenDoor
    node: CE14WoodenDoor

- type: entity
  id: CE14WoodenDoorMirrored
  parent: CE14WoodenDoor
  suffix: Opened, Mirrored
  components:
  - type: Door
    openSpriteState: open_mirrored
    closedSpriteState: closed_mirrored
  - type: Construction
    graph: CE14WoodenDoor
    node: CE14WoodenDoorMirrored

