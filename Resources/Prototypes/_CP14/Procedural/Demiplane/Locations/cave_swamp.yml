- type: CE14Location
  id: SwampCaves
  name: CE14-demiplane-location-cave-grass
  icon:
    sprite: _CE14/Interface/Misc/demiplane_locations.rsi
    state: swamp_caves
  levels:
    min: 1
    max: 10
  locationConfig: CE14SwampGeode
  tags:
  - CE14DemiplaneOres
  - CE14DemiplaneHerbals
  - CE14DemiplaneUnderground
  - CE14DemiplaneWater
  - CE14DemiplaneAnimalsSwamp
  components:
  - type: Biome
    template: CE14CavesIndestructibleFill
  - type: Roof
  - type: CE14SetGridRooved
  - type: SunShadow
  - type: SunShadowCycle
  - type: MapLight
    ambientLightColor: "#BFEEFFFF"

- type: dungeonConfig
  id: CE14SwampGeode
  layers:
  # Masks
  - !type:NoiseDistanceDunGen
    size: 90, 90
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.9
    layers:
    - tile: CE14FloorSand
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  - !type:NoiseDistanceDunGen
    size: 60, 60
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.7
    layers:
    - tile: CE14FloorGrass
      threshold: 0.50
      noise:
        frequency: 0.030
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  # Biomes
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14SwampFill
    tileMask:
    - CE14FloorGrass
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14CavesGeneric
    tileMask:
    - CE14FloorSand