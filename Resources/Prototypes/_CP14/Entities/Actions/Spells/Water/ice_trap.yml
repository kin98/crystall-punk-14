- type: entity
  id: CE14ActionSpellIceTrap
  parent: CE14ActionSpellBase
  name: Ice trap
  description: Creates a ice trap at the selected location. Don't forget to recharge it with mana.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.9
  - type: CE14ActionManaCost
    manaCost: 40
  - type: CE14ActionSpeaking
    startSpeech: "Signum glaciei..."
    endSpeech: "hunc locum custodi"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneIceTrap
  - type: Action
    useDelay: 4
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: ice_trap
  - type: DoAfterArgs
    delay: 5
  - type: TargetAction
    range: 3
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectIceTrap
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14SpawnMagicIceTrap

- type: entity
  id: CE14RuneIceTrap
  parent: CE14BaseMagicTrap
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    layers:
    - state: small_circle
      color: "#5eabeb"
      shader: unshaded
    - state: rune_ice
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectIceTrap
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14SpawnMagicIceTrap
  parent: CE14BaseMagicTrap
  name: ice trap
  description: A rune of ice drawn on the ground using magic — it's best not to step on it.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: small_circle
      color: "#5eabeb"
      shader: unshaded
    - state: rune_ice
      color: "#5eabeb"
      shader: unshaded
  - type: Fixtures
    fixtures:
      trap:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
          - MobMask
        layer:
          - SlipLayer
  - type: CE14MagicEnergyExaminable
  - type: CE14MagicEnergyContainer
    maxEnergy: 42
    energy: 42
    unsafeSupport: true
  - type: CE14MagicEnergyDraw
    energy: -0.5
    delay: 5
  - type: CE14MagicUnsafeDamage
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: TriggerOnCollide
    fixtureID: trap
  - type: DeleteOnTrigger
  - type: EmitSoundOnTrigger
    sound:
      collection: ToySqueak
  - type: SpawnOnTrigger
    proto: CE14ActionSpellIceTrapEffect

- type: entity
  id: CE14ActionSpellIceTrapEffect
  name: ice circle
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/Magic/cast_impact.rsi
    drawdepth: Mobs
    noRot: true
    layers:
      - state: circle_decrease
        color: "#5eabeb"
        shader: unshaded
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
      - HideContextMenu
  - type: CE14AreaEntityEffect
    range: 1
    effects:
    - !type:CE14SpellApplyEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Cold: 10
      - !type:MovespeedModifier
        walkSpeedModifier: 0.0
        sprintSpeedModifier: 0.0
        statusLifetime: 3
      - !type:AdjustTemperature
        amount: -50000
      - !type:ExtinguishReaction
    - !type:CE14SpellSpawnEntityOnTarget
      spawns:
      - CE14WindowMagicIceBlock
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/balloon-pop.ogg
      params:
        variation: 0.1
        volume: -2
  - type: TriggerOnSpawn

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollIceTrap
  name: ice trap spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellIceTrap

- type: entity
  parent: CE14SpawnMagicIceTrap
  id: CE14SpawnMagicIceTrapInvisible
  suffix: Invisible. Permanent
  components:
  - type: Visibility
    layer: 16
  - type: CE14MagicEnergyDraw
    energy: 0
    delay: 0

- type: entity
  parent: CE14SpawnMagicIceTrap
  id: CE14SpawnMagicIceTrapPermanent
  suffix: Permanent
  components:
  - type: CE14MagicEnergyDraw
    energy: 0
    delay: 0
