- type: entity
  id: CE14WindowWooden
  parent:
  - CE14WindowBase
  - CE14BaseFlammable
  name: wooden window
  description: A wooden wall with a glass window in it.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/wooden_window.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/wooden_window.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14GlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ChangeConstructionNodeBehavior
        node: CE14WindowWoodenBroken
  - type: Construction
    graph: CE14WindowWooden
    node: CE14WindowWooden

