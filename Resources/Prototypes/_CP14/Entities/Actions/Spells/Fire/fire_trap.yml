- type: entity
  id: CE14ActionSpellFireTrap
  parent: CE14ActionSpellBase
  name: Fire trap
  description: Creates a fire trap at the selected location. Don't forget to recharge it with mana.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.9
  - type: CE14ActionManaCost
    manaCost: 40
  - type: CE14ActionSpeaking
    startSpeech: "Signum ignis..."
    endSpeech: "hunc locum custodi"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneFireTrap
  - type: Action
    useDelay: 4
    icon:
      sprite: _CE14/Actions/Spells/fire.rsi
      state: fire_trap
  - type: TargetAction
    range: 3
  - type: DoAfterArgs
    delay: 2
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectFireTrap
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14SpawnMagicFireTrap

- type: entity
  id: CE14RuneFireTrap
  parent: CE14BaseMagicTrap
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    layers:
    - state: small_circle
      color: "#fdda5d"
      shader: unshaded
    - state: rune_fire
      color: "#eea911"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectFireTrap
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#eea911"
      shader: unshaded

- type: entity
  id: CE14SpawnMagicFireTrap
  parent: CE14BaseMagicTrap
  name: fire trap
  description: A rune of fire drawn on the ground using magic — it's best not to step on it.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: small_circle
      color: "#fdda5d"
      shader: unshaded
    - state: rune_fire
      color: "#eea911"
      shader: unshaded
  - type: Fixtures
    fixtures:
      trap:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
          - MobMask
        layer:
          - SlipLayer
  - type: CE14MagicEnergyExaminable
  - type: CE14MagicEnergyContainer
    maxEnergy: 42
    energy: 42
    unsafeSupport: true
  - type: CE14MagicEnergyDraw
    energy: -0.5
    delay: 5
  - type: CE14MagicUnsafeDamage
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: TriggerOnCollide
    fixtureID: trap
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 3
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 8.0
    intensitySlope: 3
    maxIntensity: 2
  - type: DeleteOnTrigger

- type: entity
  parent: CE14BaseSpellScrollFire
  id: CE14SpellScrollFireTrap
  name: fire trap spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellFireTrap

- type: entity
  parent: CE14SpawnMagicFireTrap
  id: CE14SpawnMagicFireTrapInvisible
  suffix: Invisible. Permanent. Admin
  components:
  - type: Visibility
    layer: 16
  - type: CE14MagicEnergyDraw
    energy: 0
    delay: 0

- type: entity
  parent: CE14SpawnMagicFireTrap
  id: CE14SpawnMagicFireTrapPermanent
  suffix: Permanent
  components:
  - type: CE14MagicEnergyDraw
    energy: 0
    delay: 0
