- type: entity
  abstract: true
  id: CE14BaseFork
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: ThrowingAngle
    angle: -90
  - type: MeleeWeapon
    attackRate: 1
    range: 2
    angle: 10
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 3
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.3
    cPAnimationOffset: 1.75
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 3
  - type: CE14BonusDistanceMeleeDamage
    minDistance: 2
    bonusDamage:
      types:
        Piercing: 3
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    breakOnMove: false
    equipDelay: 1
    unequipDelay: 1
  - type: CE14EditTileTool
    sound:
      collection: CE14Digging
    tileReplace:
      CE14FloorDirt: CE14FloorDirtSeedbed
      CE14FloorDirtSeedbed: CE14FloorDirt

- type: entity
  parent: CE14BaseFork
  id: CE14WeaponFork
  name: fork
  description: A simple fork for digging and planting seeds in the soil.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Fork/fork.rsi
    state: icon