- type: entity
  id: CE14SpawnPointGhostDemiplaneSkeletonT2
  name: ghost role spawn point
  description: A ghost role for a bloodthirsty and cunning skeleton.
  suffix: skeleton random T2
  categories: [ ForkFiltered ]
  parent: MarkerBase
  components:
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - !type:GroupSelector
        weight: 40
        children:
        - id: CE14SpawnPointGhostDemiplaneSkeletonWizardT2
#        - id: CE14SpawnPointGhostDemiplaneSkeletonBardT2
      - !type:GroupSelector
        weight: 60
        children:
        - id: CE14SpawnPointGhostDemiplaneSkeletonSwordT2
        - id: CE14SpawnPointGhostDemiplaneSkeletonDodgerT2
        - id: CE14SpawnPointGhostDemiplaneSkeletonArcherT2
        - id: CE14SpawnPointGhostDemiplaneSkeletonHalberdT2
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: _CE14/Mobs/Species/Skeleton/parts.rsi
        state: full

