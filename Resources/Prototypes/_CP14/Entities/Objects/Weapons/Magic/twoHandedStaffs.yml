- type: entity
  id: CE14MagicHealingStaff
  parent:
  - BaseItem
  - CE14BaseWeaponDestructible
  name: magic healing staff
  description: A long, half-tech, half-magic stick designed to convert magical energy into healing spells.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Magic/TwoHandedStaff/healing_staff.rsi
    layers:
    - state: icon
  - type: Clothing
    equipDelay: 1
    unequipDelay: 1
    sprite: _CE14/Objects/Weapons/Magic/TwoHandedStaff/healing_staff.rsi
    quickEquip: false
    breakOnMove: false
    slots:
    - neck
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 3
  - type: Damageable
    damageContainer: Inorganic
  - type: CE14MeleeSelfDamage
    damageToSelf:
      types:
        Blunt: 1 # 50 hits
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: MeleeWeapon
    angle: 100
    attackRate: 1.3
    range: 1.3
    wideAnimationRotation: 135
    wideAnimation: CE14WeaponArcSlash
    damage:
      types:
        Blunt: 3
    soundHit:
      collection: MetalThud
    cPAnimationLength: 0.3
    cPAnimationOffset: 1.3
  - type: CE14SpellStorageAccessHolding
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellCureWounds
    - CE14ActionSpellCureBurn
    - CE14ActionSpellBloodPurification
  - type: CE14MagicEnergyExaminable
  - type: CE14MagicEnergyContainer
    energy: 80
    maxEnergy: 80
  - type: StaticPrice
    price: 300

- type: entity
  id: CE14MagicShadowStaff
  parent: CE14MagicHealingStaff
  name: magic shadow staff
  description: A long, half-tech, half-magic stick designed to convert magical energy into shadow spells.
  categories: [ DoNotMap ]
  suffix: Artifact
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellShadowStep
    - CE14ActionSpellShadowGrab
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Magic/TwoHandedStaff/shadow_staff.rsi
  - type: Clothing
    sprite: _CE14/Objects/Weapons/Magic/TwoHandedStaff/shadow_staff.rsi
  - type: StaticPrice
    price: 300

