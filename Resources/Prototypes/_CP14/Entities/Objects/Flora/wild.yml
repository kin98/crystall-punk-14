        base1: ""
        base2: ""
        base3: ""
        base4: ""
        base5: ""
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CE14AgaricMushroom
        Quantity: 3
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4
        reagents:
        - ReagentId: CE14AgaricMushroom
          Quantity: 3
  - type: Tag
    tags:
    - CE14FitInMortar
    - CE14AlchemicalHerbals

- type: entity
  id: CE14ChromiumSlime
  parent: CE14WildProduceBase
  name: chromium slime
  description: This rare thick substance can be found in a stream of water as if it has a mind of its own. When trying to change the slime itself - the slime changes the reagent it interacts with.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Flora/Wild/chromium_slime.rsi
    layers:
      - state: base1
        map: ["random"]
  - type: RandomSprite
    available:
    - random:
        base1: ""
        base2: ""
        base3: ""
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CE14ChromiumSlime
        Quantity: 4
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: CE14ChromiumSlime
          Quantity: 4
  - type: Temperature
    currentTemperature: 250
  - type: InternalTemperature
    thickness: 0.02
    area: 0.02
  - type: CE14TemperatureTransformation
    entries:
    - temperatureRange: 100, 200
      transformTo: CE14FoodChromiumJelly

- type: entity
