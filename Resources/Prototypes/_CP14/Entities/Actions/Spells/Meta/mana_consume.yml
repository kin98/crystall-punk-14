- type: entity
  id: CE14ActionSpellManaConsume
  parent: CE14ActionSpellBase
  name: Mana consume
  description: You absorb a small amount of mana from the target.
  components:
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneManaConsume
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: mana_consume
  - type: DoAfterArgs
    repeat: true
    breakOnMove: true
    delay: 1
    breakOnDamage: true
  - type: TargetAction
  - type: EntityTargetAction
    whitelist:
      components:
      - CE14MagicEnergyContainer
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaConsume
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaConsume
      - !type:CE14SpellConsumeManaEffect
        mana: 10

- type: entity
  id: CE14ActionSpellManaConsumeElf
  parent: CE14ActionSpellManaConsume
  name: Carefull mana consume
  description: You absorb mana at a tremendous rate without dealing damage to the mana holder.
  components:
  - type: EntityTargetAction
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaConsume
      - !type:CE14SpellConsumeManaEffect
        safe: true
        mana: 20

- type: entity
  id: CE14RuneManaConsume
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5096d4"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#5096d4"
      shader: unshaded
    - state: double_outer
      color: "#5096d4"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectManaConsume
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_down
      color: "#5096d4"
      shader: unshaded

