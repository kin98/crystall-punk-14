- type: entity
  abstract: true
  id: CE14BaseWeaponTwoHandedSword
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 0.6
    range: 1.6
    angle: 170 #Bigger in 2 times
    wideAnimationRotation: -90
    damage:
      types:
        Slash: 7
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.5
    cPAnimationOffset: 1
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 13
  - type: CE14ComboBonusMeleeDamage
    bonusDamage:
      types:
        Piercing: 10
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    breakOnMove: false
    equipDelay: 1
    unequipDelay: 1

- type: entity
  parent: CE14BaseWeaponTwoHandedSword
  id: CE14WeaponTwoHandedSwordIron
  name: iron two-handed sword
  description: A large and heavy two-handed sword. Heavy means reliable.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/TwoHandedSword/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 10
      CE14Iron: 30
