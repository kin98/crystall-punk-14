- type: entity
  id: CE14WindowMarbleBrick
  parent: CE14WindowBase
  name: marble brick window
  description: A marble brick wall with a glass window in it.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/marble_bricks_window.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/marble_bricks_window.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14GlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ChangeConstructionNodeBehavior
        node: CE14WindowMarbleBrickBroken
  - type: Construction
    graph: CE14WindowMarbleBrick
    node: CE14WindowMarbleBrick

- type: entity
  id: CE14WindowFrameMarbleBrick
  name: marble brick window frame
  parent: CE14BaseWindowFrame
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/marble_bricks_window_frame.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/marble_bricks_window_frame.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14RockStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14MarbleBlock1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14WindowMarbleBrick
    node: CE14WindowFrameMarbleBrick

- type: entity
  id: CE14WindowMarbleBrickBroken
  name: shattered marble brick window
  parent:
  - CE14BaseWindowFrameBroken
  - CE14WindowFrameMarbleBrick
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/marble_bricks_window_broken.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/marble_bricks_window_broken.rsi
  - type: Construction
    graph: CE14WindowMarbleBrick
    node: CE14WindowMarbleBrickBroken
