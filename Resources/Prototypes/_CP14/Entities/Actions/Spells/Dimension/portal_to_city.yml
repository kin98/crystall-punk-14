- type: entity
  id: CE14ActionSpellPortalToCity
  parent: CE14ActionSpellBase
  name: Portal to city
  description: You open a portal leading to a city that will last for one minute.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 30
  - type: CE14ActionDoAfterVisuals
    proto: CE14ImpactEffectShadowStep
  - type: CE14ActionFreeHandsRequired
  - type: DoAfterArgs
    breakOnHandChange: false
    breakOnMove: true
    delay: 2
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/dimension.rsi
      state: demi_arrow
  - type: TargetAction
    range: 3
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectShadowStep
      effects:
      - !type:CE14SpellTeleportToCity

- type: entity
  parent: CE14BaseSpellScrollDimension
  id: CE14BaseSpellScrollPortalToCity
  name: city portal spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellPortalToCity
