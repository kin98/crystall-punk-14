- type: entity
  id: CE14ActionSpellLightningStrikeSmall
  parent: CE14ActionSpellBase
  name: Small lightning strike
  description: You charge a lightning bolt that burns a medium amount of stamina from the target.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 7
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 4
    icon:
      sprite: _CE14/Actions/Spells/electromancy.rsi
      state: lightning_strike_small
  - type: TargetAction
    range: 3
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ElectrifiedEffect
      - !type:CE14SpellCreateBeam
        beamProto: CE14LightningStrikeSmallBeam
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:Jitter
        - !type:CE14StaminaChange
          staminaDelta: -15
        - !type:HealthChange
          ignoreResistances: false
          damage:
            types:
              Shock: 4
      - !type:CE14SpellThrowFromUser
        throwPower: 2
        distance: 0.5

- type: entity
  name: lightning
  id: CE14LightningStrikeSmallBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_CE14/Effects/Beams/lightning.rsi
    drawdepth: Effects
    layers:
    - state: lightning_small
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#e8ff4c"
    radius: 1.2
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: 
      collection: sparks
  - type: TimedDespawn
    lifetime: 1
  - type: LightFade
    duration: 1
  - type: Tag
    tags:
      - HideContextMenu
  - type: CE14SpellEffectOnCollide
    effects:
    - !type:CE14SpellSpawnEntityOnTarget
      spawns:
      - CE14ElectrifiedEffect
    - !type:CE14SpellApplyEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Shock: 2
      - !type:Jitter
      - !type:CE14StaminaChange
        staminaDelta: -8