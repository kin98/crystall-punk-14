- type: entity
  id: CE14ActionSpellKick
  parent: CE14ActionSpellBase
  name: Kick
  description: You perform an epic leg kick at your chosen object, pushing it away from you.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.4
  - type: CE14ActionStaminaCost
    stamina: 40
  - type: CE14ActionEmoting
    startEmote: CE14-kick-emote-start
    endEmote: CE14-kick-emote
  - type: CE14ActionDangerous
  - type: DoAfterArgs
    breakOnHandChange: false
    distanceThreshold: 1.5
    delay: 0.5
  - type: Action
    useDelay: 5
    sound: null
    icon:
      sprite: _CE14/Actions/Spells/physical.rsi
      state: kick
  - type: TargetAction
    range: 1
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Body
      - Item
      - Anchorable
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellKnockdown
      - !type:CE14SpellThrowFromUser
        distance: 1.5
        throwPower: 5
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14DustEffectKickSound
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          ignoreResistances: false
          damage:
            types:
              Blunt: 5

- type: entity
  id: CE14DustEffectKickSound
  parent: CE14DustEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: EmitSoundOnSpawn
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/hit_kick.ogg
      params:
        pitch: 1
