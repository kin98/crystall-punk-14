- type: entity
  id: CE14CookerBase
  parent: BaseStorageItem
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: opened }
          False: { state: closed }
      enum.CE14CookingVisuals.Cooking:
        cook:
          True: { visible: true }
          False: { visible: false }
      enum.CE14CookingVisuals.Burning:
        burn:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,3
    whitelist:
      components:
        - Food
        - Edible
      tags:
        - CE14FitInFryingPan #Todo delete this tag from game
    CE14Ignorelist:
      components:
        - CE14FoodHolder
        - FoodSequenceStartPoint
  - type: CE14FoodCooker
    containerId: storagebase
  - type: Temperature
  - type: DoAfter
  - type: AmbientSound
    enabled: false
    volume: 5
    range: 5