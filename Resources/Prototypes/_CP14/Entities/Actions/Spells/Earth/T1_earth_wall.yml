- type: entity
  id: CE14ActionSpellEarthWall
  parent: CE14ActionSpellBase
  name: Earth wall
  description: Raises a solid wall of earth from the bowels.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.3
  - type: CE14ActionManaCost
    manaCost: 15
  - type: CE14ActionMaterialCost
    requirement: !type:StackResource
      stack: CE14Dirt
      count: 2
  - type: CE14ActionSpeaking
    startSpeech: "Surgite terram..."
    endSpeech: "de profundis terrae"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneEarthWall
  - type: DoAfterArgs
    delay: 1.5
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/earth.rsi
      state: earth_wall
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectEarthWall
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14WallSpawnEarthWall

- type: entity
  id: CE14RuneEarthWall
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#8f6a2b"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#8f6a2b"
      shader: unshaded
    - state: medium_circle
      color: "#8f6a2b"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectEarthWall
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#8f6a2b"
      shader: unshaded

- type: entity
  id: CE14WallSpawnEarthWall
  categories: [ HideSpawnMenu ]
  save: false
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: True
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Sprite
    offset: 0, 0.2
    sprite: _CE14/Effects/cubeup.rsi
    state: cube_up
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        hard: false
  - type: TimedDespawn
    lifetime: 1.2
  - type: SpawnOnDespawn
    prototype: CE14WallDirt

- type: entity
  parent: CE14BaseSpellScrollEarth
  id: CE14SpellScrollEarthWall
  name: earth wall spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellEarthWall

