- type: entity
  abstract: true
  id: CE14BaseWeaponToolHammer
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponThrowable
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
        Structural: 3
  - type: MeleeWeapon
    resetOnHandSelected: true
    autoAttack: true
    attackRate: 2
    range: 1
    angle: 60
    wideAnimationRotation: -90
    damage:
      types:
        Blunt: 5
        Structural: 3
    animation: CE14WeaponArcSlash
    wideAnimation: CE14WeaponArcSlash
    soundHit:
      collection: MetalThud
    cPAnimationLength: 0.25
    cPAnimationOffset: 1
  - type: Clothing
    slots:
    - belt
    breakOnMove: false
    equipDelay: 0.5
    unequipDelay: 0.5
  - type: Tool
    qualities:
      - CE14Hammering
    useSound:
      collection: CE14Hammering
      params:
        variation: 0.03
        volume: 2

- type: entity
  parent: CE14BaseWeaponToolHammer
  id: CE14WeaponHammerIron
  name: iron hammer
  description: A standard hammer made of iron.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Hammer/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 10
      CE14Iron: 10
