- type: entity
  id: CE14ActionSpellLurkerKick
  parent: CE14ActionSpellBase
  name: Crushing attack
  description: You prepare a powerful melee strike that will knock your target back with force and stun them for a long time.
  components:
  - type: CE14ActionStaminaCost
    stamina: 20
  - type: DoAfterArgs
    delay: 2.5
    distanceThreshold: 2.5
    breakOnDamage: true
  - type: CE14ActionEmoting
    startEmote: CE14-kick-lurker-start
    endEmote: CE14-kick-lurker
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 20
    icon:
      sprite: _CE14/Actions/Spells/lurker.rsi
      state: kick
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellRevealStealthUser
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14LurkerRitualSound
      effects:
      - !type:CE14SpellRevealStealthUser
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:Paralyze
          paralyzeTime: 15
      - !type:CE14SpellThrowFromUser
        throwPower: 4
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14DustEffectKickSound
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          ignoreResistances: false
          damage:
            types:
              Blunt: 10
