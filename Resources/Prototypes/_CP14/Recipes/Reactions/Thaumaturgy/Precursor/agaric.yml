
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14AgaricShroomSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14AgaricMushroom:
      amount: 1
  products:
    CE14EssencePoison: 0.5
    CE14EssenceEarth: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

# invert Brute treatment into poison and back

- type: reaction
  id: CE14AgaricShroomAdmixture1
  minTemp: 500
  reactants:
    CE14AgaricMushroom:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14HealingEffectHealBrute:
      amount: 1
  products:
    CE14DamageEffectDamageBrute: 2
    CE14SideEffectRainbow: 1

- type: reaction
  id: CE14AgaricShroomAdmixture2
  minTemp: 500
  reactants:
    CE14AgaricMushroom:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14DamageEffectDamageBrute:
      amount: 1
  products:
    CE14HealingEffectHealBrute: 2
