        base2: ""
        base3: ""
        base4: ""
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CE14WildSageSap
        Quantity: 15
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 17
        reagents:
        - ReagentId: CE14WildSageSap
          Quantity: 15
  - type: Tag
    tags:
    - CE14FitInMortar
    - CE14AlchemicalHerbals
  - type: Temperature
    currentTemperature: 290
  - type: InternalTemperature
    thickness: 0.02
    area: 0.02
  - type: CE14TemperatureTransformation
    entries:
