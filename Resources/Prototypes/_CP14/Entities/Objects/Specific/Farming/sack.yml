- type: entity
  name: produce sack
  id: CE14SackFarming #Remove "Farming"
  parent: 
  - BaseStorageItem
  - CE14ClothingHeadBase
  description: Bag for quick transport of items
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE14/Objects/Storage/sack.rsi
    state: icon
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,3
    quickInsert: true
    areaInsert: true
  - type: Dumpable
  - type: PhysicalComposition
    materialComposition:
      CE14Cloth: 55
  - type: FlashImmunity
  - type: IdentityBlocker
  - type: EyeProtection
  - type: IngestionBlocker
  - type: Blindfold

- type: entity
  id: CE14SackFarmingVegetables
