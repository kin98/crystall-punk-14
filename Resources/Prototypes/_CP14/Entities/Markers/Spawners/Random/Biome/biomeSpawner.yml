- type: entity
  id: CE14BaseBiomeSpawner
  name: biome spawner
  description: Spawns of various biomes on the map.
  abstract: true
  placement:
    mode: SnapgridCenter
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    snapCardinals: true
    drawdepth: BelowFloor
    sprite: _CE14/Markers/biome.rsi
  - type: CE14BiomeSpawner
    deleteBlacklist:
      components:
      - Portal
      - MindContainer
  - type: PlacementReplacement
    key: CE14BiomeSpawner

- type: entity
  id: CE14BiomeSpawnerGrassland
  parent: CE14BaseBiomeSpawner
  suffix: T0 Resources, Grassland
  components:
  - type: Sprite
    layers:
      - state: grass
      - state: frame
  - type: CE14BiomeSpawner
    biome: CE14GrasslandComossResources

- type: entity
  id: CE14BiomeSpawnerCave
  parent: CE14BaseBiomeSpawner
  suffix: T0 Resources, Cave Tunnels
  components:
  - type: Sprite
    layers:
      - state: cave
      - sprite: _CE14/Structures/Flora/Rocks/rocks_small.rsi
        state: rock0
      - state: frame
  - type: CE14BiomeSpawner
    biome: CE14CavesComossResources

