- type: entity
  id: CE14ActionSpellWaterCreation
  parent: CE14ActionSpellBase
  name: Water creation
  description: Creating a clot of water that is held in a floating balloon shape for some time
  components:
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneWaterCreation
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: water_creation
  - type: DoAfterArgs
    delay: 1
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectWaterCreation
      - !type:CE14SpellSpawnInHandEntity
        spawns:
        - CE14LiquidDropWater

- type: entity
  id: CE14RuneWaterCreation
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5eabeb"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14LiquidDropWater
  parent:
  - BaseItem
  - ItemHeftyBase
  name: floating liquid drop
  description: A clot of liquid held in the shape of a ball by magic
  suffix: Water
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Ginormous
  - type: SolutionContainerManager
    solutions:
      drop:
        maxVol: 10
        reagents:
        - ReagentId: Water
          Quantity: 10
  - type: CE14MeleeSelfDamage
    damageToSelf:
      types:
        Blunt: 1 # 1 hits
  - type: LandAtCursor
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 0.1
    damage:
      types:
        Blunt: 1
  - type: MeleeWeapon
    attackRate: 1.8
    wideAnimationRotation: 225
    wideAnimation: CE14WeaponArcSlash
    damage:
      types:
        Blunt: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: drop
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PassiveDamage # Around 8 damage a minute healed
    damage:
      groups:
        Brute: 0.016 # ~ 1 minute
  - type: Damageable
    damageContainer: Biological
  - type: Edible
    edible: Drink
    solution: drop
    delay: 0.5
    forceFeedDelay: 1.5
  - type: ExaminableSolution
    solution: drop
  - type: RefillableSolution
    solution: drop
  - type: InjectableSolution
    solution: drop
  - type: FitsInDispenser
    solution: drop
  - type: MixableSolution
    solution: drop
  #- type: SolutionTransfer
  #  canChangeTransferAmount: false
  - type: SolutionItemStatus
    solution: drop
  - type: CE14SolutionTemperature
  - type: Appearance
  - type: Sprite
    sprite: _CE14/Objects/Misc/liquid_drop.rsi
    layers:
      - state: liq-1
        map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: liq-
    inHandsMaxFillLevels: 1
    inHandsFillBaseName: -fill
  - type: Injector
    solutionName: drop
    injectOnly: true
    transferAmounts:
    - 5
    currentTransferAmount: 5
    toggleState: 0

- type: entity
  id: CE14ImpactEffectWaterCreation
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5eabeb"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollWaterCreation
  name: water creation spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellWaterCreation

