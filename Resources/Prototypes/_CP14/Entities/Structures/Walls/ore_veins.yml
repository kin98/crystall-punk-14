
- type: entity
  id: CE14WallStoneCopperOre
  suffix: copper ore
  parent: CE14WallStone
  description: A solid stone natural wall. You can see the sharp flecks of copper in it.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Walls/Natural/cave_stone_copper.rsi
  - type: Icon
    sprite: _CE14/Structures/Walls/Natural/cave_stone_copper.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14OreCopper1:
            min: 4
            max: 7
      - !type:DoActsBehavior
        acts: ["Destruction"]

