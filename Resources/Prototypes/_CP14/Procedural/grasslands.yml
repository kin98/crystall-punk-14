# Use https://auburn.github.io/FastNoiseLite/ to Preview
# Базовый биом лугов.

- type: biomeTemplate
  id: CE14GrassFill
  layers:
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CE14FloorGrass
    - !type:BiomeTileLayer
      tile: CE14FloorGrassLight
      threshold: 0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
    - !type:BiomeTileLayer
      tile: CE14FloorGrassTall
      threshold: 0.45
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120

- type: biomeTemplate
  id: CE14Grassland
  layers:
    - !type:BiomeMetaLayer
      template: CE14GrassFill
    - !type:BiomeDecalLayer #Rock decal
      allowedTiles:
      - CE14FloorGrass
      - CE14FloorGrassLight
      - CE14FloorGrassTall
      threshold: 0.6
      divisions: 1
      noise:
        seed: 18
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.11
        octaves: 3
        lacunarity: 1.7
        gain: 0.8
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      decals:
        - CE14FloraRock01
        - CE14FloraRock02
        - CE14FloraRock03
        - CE14FloraRock04
        - CE14FloraRock05
    - !type:BiomeDecalLayer #Grass decal
      allowedTiles:
      - CE14FloorGrass
      - CE14FloorGrassLight
      - CE14FloorGrassTall
      threshold: 0
      divisions: 1
      noise:
        seed: 12
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      decals:
        - CE14FloraGrass1
        - CE14FloraGrass2
        - CE14FloraGrass3
        - CE14FloraGrass4
        - CE14FloraGrass5
        - CE14FloraGrass6
        - CE14FloraGrass7
        - CE14FloraGrass8
        - CE14FloraGrass9
        - CE14FloraGrass10
        - CE14FloraGrass11
        - CE14FloraGrass12
        - CE14FloraGrass13
        - CE14FloraGrass14
    - !type:BiomeDecalLayer #Bush decal
      allowedTiles:
      - CE14FloorGrass
      - CE14FloorGrassLight
      - CE14FloorGrassTall
      threshold: 0.35
      divisions: 1
      noise:
        seed: 12
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      decals:
        - CE14GrassBushes1
        - CE14GrassBushes2
        - CE14GrassBushes3
        - CE14GrassBushes4
        - CE14GrassBushes5
        - CE14GrassBushes6
        - CE14GrassBushes7
        - CE14GrassBushes8
        - CE14GrassBushes9
    - !type:BiomeEntityLayer # Tall grass!
      threshold: 0.3
      noise:
        seed: 23
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      allowedTiles:
        - CE14FloorGrassTall
      entities:
        - CE14RandomBushOffsetSpawner
    - !type:BiomeEntityLayer # Rare Trees
      threshold: 0.8
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorGrass
        - CE14FloorGrassLight
        - CE14FloorGrassTall
      entities:
        - CE14FloraTreeBirchLarge
        - CE14FloraTreeBirchSmall
        - CE14FloraTreeBirchMedium
        - CE14FloraTreeSpruceSmall
        - CE14FloraTreeSpruceSmall
        - CE14FloraTreeSpruceMedium
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreenLarge
        - CE14FloraTreeDead
        - CE14FloraTreeDeadSmall
    - !type:BiomeEntityLayer # More Rocks
      threshold: 0.7
      noise:
        seed: 18
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 3
      allowedTiles:
        - CE14FloorGrass
        - CE14FloorGrassLight
        - CE14FloorGrassTall
      entities:
        - CE14RockSmall
    - !type:BiomeEntityLayer # More Rocks
      threshold: 0.8
      noise:
        seed: 27
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorGrass
        - CE14FloorGrassLight
        - CE14FloorGrassTall
      entities:
        - CE14RockBig
        - CE14RockBigMoss

# Подбиомы лугов

- type: biomeTemplate
  id: CE14GrasslandForest # Лес
  layers:
    - !type:BiomeMetaLayer
      template: CE14Grassland
    - !type:BiomeEntityLayer # More Trees
      threshold: 0.2
      noise:
        seed: 4
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorGrass
        - CE14FloorGrassLight
        - CE14FloorGrassTall
      entities:
        - CE14FloraTreeBirchLarge
        - CE14FloraTreeBirchSmall
        - CE14FloraTreeBirchMedium
        - CE14FloraTreeSpruceSmall
        - CE14FloraTreeSpruceSmall
        - CE14FloraTreeSpruceMedium
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreen
        - CE14FloraTreeGreenLarge
        - CE14FloraTreeDead
        - CE14FloraTreeDeadSmall

- type: biomeTemplate
  id: CE14GrasslandHills # Холмы
  layers:
    - !type:BiomeMetaLayer
      template: CE14GrasslandForest
    - !type:BiomeTileLayer
      tile: CE14FloorBase
      invert: true
      threshold: 0.5
      noise:
        seed: 6
        noiseType: OpenSimplex2
        frequency: 0.03
        lacunarity: 2
        fractalType: Ridged
        octaves: 1
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance
        cellularJitterModifier: 0.7
        domainWarpType: OpenSimplex2Reduced
        domainWarpAmp: 285
    - !type:BiomeEntityLayer # Walls
      allowedTiles:
        - CE14FloorBase
      threshold: -1.0
      entities:
        - CE14WallDirt

- type: biomeTemplate
  id: CE14GrasslandTestResult
  layers:
    - !type:BiomeMetaLayer
      template: CE14Grassland
    - !type:BiomeMetaLayer
      template: CE14GrasslandForest
      threshold: 0.2
      noise:
        seed: 18
        frequency: 0.02
        fractalType: None
    - !type:BiomeMetaLayer
      template: CE14GrasslandHills
      threshold: 0.4
      noise:
        seed: 14
        frequency: 0.02
        fractalType: None
    # Lakes start
    - !type:BiomeTileLayer
      tile: CE14FloorSand
      threshold: 0.55
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.01
        domainWarpType: OpenSimplex2
        domainWarpAmp: 150
    - !type:BiomeTileLayer
      tile: CE14FloorDirt
      threshold: 0.68
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.01
        domainWarpType: OpenSimplex2
        domainWarpAmp: 150
    - !type:BiomeEntityLayer
      allowedTiles:
        - CE14FloorDirt
        - CE14FloorSand
      threshold: 0.6
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.01
        domainWarpType: OpenSimplex2
        domainWarpAmp: 150
      entities:
        - CE14FloorWater
    # Lakes end

