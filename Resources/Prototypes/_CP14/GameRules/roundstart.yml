# event schedulers

- type: entity
  id: CE14BasicStationEventScheduler
  parent: CE14BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: CE14BasicGameRulesTable

- type: entityTable
  id: CE14BasicGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: CE14BasicCalmEventsTable

