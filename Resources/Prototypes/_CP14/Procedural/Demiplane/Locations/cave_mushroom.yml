- type: CE14Location
  id: MushroomCaves
  name: CE14-demiplane-location-mushroom-caves
  icon:
    sprite: _CE14/Interface/Misc/demiplane_locations.rsi
    state: mushroom_caves
  levels:
    min: 1
    max: 10
  locationConfig: CE14MushroomCaves
  tags:
  - CE14DemiplaneOres
  - CE14DemiplaneUnderground
  - CE14DemiplaneMushrooms
  components:
  - type: Biome
    template: CE14ChasmFill
  - type: Roof
  - type: CE14SetGridRooved
  - type: SunShadow
  - type: SunShadowCycle
  - type: MapLight
    ambientLightColor: "#BFEEFFFF"

- type: dungeonConfig
  id: CE14MushroomCaves
  layers:
  # Masks
  - !type:NoiseDistanceDunGen
    size: 90, 90
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.9
    layers:
    - tile: CE14FloorSand
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  - !type:NoiseDistanceDunGen
    size: 60, 60
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.5
    layers:
    - tile: CE14FloorGrass
      threshold: 0.50
      noise:
        frequency: 0.030
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  # Biomes
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14MushroomsCaveResult
    tileMask:
    - CE14FloorSand
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14CavesMushroomFloor
    tileMask:
    - CE14FloorGrass