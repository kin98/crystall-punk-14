- type: constructionGraph
  id: CE14TargetStake
  start: start
  graph:
    - node: start
      edges:
        - to: CE14targetStake
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - stackGroup: WoodenPlanks
              amount: 2
              doAfter: 2

    - node: CE14targetStake
      entity: CE14TargetStake
      edges:
        - to: start
          completed:
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 1
        - to: CE14target
          steps:
            - stackGroup: WoodenPlanks
              amount: 3
              doAfter: 1
            - tool: CE14Hammering
              doAfter: 1

    - node: CE14target
      entity: CE14Target
      edges:
        - to: CE14targetStake
          completed:
            - !type:GivePrototype
              prototype: CE14WoodenPlanks1
              amount: 3
          steps:
            - tool: CE14Hammering
              doAfter: 2

- type: constructionGraph
  id: CE14TargetEffigy
  start: start
  graph:
    - node: start
      edges:
        - to: CE14targetEffigy
          completed:
            - !type:SnapToGrid
          steps:
            - stackGroup: WoodenPlanks
              amount: 5
            - material: CE14Cloth
              amount: 2
    - node: CE14targetEffigy
      entity: CE14TargetEffigy
