- type: entity
  id: CE14BowlBase
  parent: BaseItem
  description: This is your bowl for a delicious soups!
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/Soups/bowls.rsi
  - type: Item
    shape:
    - 0,0,1,0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
  - type: CE14FoodHolder
    foodType: Soup
    solutionId: food
    displacementRsiPath: _CE14/Objects/Consumable/Food/Soups/displacement.rsi
    canAcceptFood: true
  - type: Appearance
  - type: SolutionContainerVisuals
  - type: Edible
    edible: Drink
    utensil: Spoon
    transferAmount: 2.5
  - type: Spillable
    solution: food

- type: entity
  id: CE14BowlWooden
  parent: CE14BowlBase
  name: wooden bowl
  components:
  - type: Sprite
    layers:
    - state: wooden
    - map: ["CE14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 20
  - type: Food
    trash: 
    - CE14BowlWooden

