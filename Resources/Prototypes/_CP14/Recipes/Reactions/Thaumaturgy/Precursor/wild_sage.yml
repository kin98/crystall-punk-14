
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14WildSageSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14WildSageSap:
      amount: 1
  products:
    CE14EssenceEarth: 0.5
    CE14EssenceOrder: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

- type: reaction
  id: CE14WildSageAdmixture1
  minTemp: 500
  reactants:
    CE14WildSageSap:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14HealingEffectHealManaDepletion:
      amount: 1
  products:
    CE14SideEffectRainbow: 2
    CE14SideEffectEmoteCough: 1

