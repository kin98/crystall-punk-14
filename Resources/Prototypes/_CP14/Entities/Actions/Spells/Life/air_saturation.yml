- type: entity
  id: CE14ActionAirSaturation
  parent: CE14ActionSpellBase
  name: Air saturation
  description: You surround the target with fresh air, healing suffocation. This can sustain the dying.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.4
  - type: CE14ActionManaCost
    manaCost: 5
  - type: DoAfterArgs
    repeat: true
    delay: 2
    breakOnDamage: true
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneAirSaturation
  - type: Action
    useDelay: 2
    icon:
      sprite: _CE14/Actions/Spells/healing.rsi
      state: air_saturation
  - type: TargetAction
    range: 2
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectAirSaturation
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          damage:
            types:
              Asphyxiation: -5
        - !type:Jitter

# Effects

- type: entity
  id: CE14ImpactEffectAirSaturation
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#c0e8fa"
      shader: unshaded

- type: entity
  id: CE14RuneAirSaturation
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#c0e8fa"
  - type: Sprite
    layers:
    - state: sun
      color: "#5096d4"
      shader: unshaded
    - state: medium_circle
      color: "#c0e8fa"
      shader: unshaded

