# Undead

- type: entity
  name: walking dead spawner
  id: CE14SpawnMobUndeadZombieRandom
  parent: MarkerBase
  suffix: Random
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - sprite: Markers/cross.rsi
      state: green
    - sprite: _CE14/Mobs/Species/Zombie/parts.rsi
      state: full
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - !type:GroupSelector
        weight: 60
        children:
        - id: CE14MobUndeadZombieGearEasy1
        - id: CE14MobUndeadZombieGearEasy2
        - id: CE14MobUndeadZombieGearEasy3
        - id: CE14MobUndeadZombieGearEasy4
        - id: CE14MobUndeadZombieGearEasy5

