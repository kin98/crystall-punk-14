- type: entity
  id: CE14MobUndeadSkeletonWizardT2
  parent: CE14MobUndeadSkeletonDemiplaneT2
  categories: [ ForkFiltered ]
  suffix: Wizard T2
  components:
  - type: Loadout
    prototypes:
    - CE14MobSkeletonWizardT2
  - type: CE14MagicEnergyContainer
    magicAlert: CE14MagicEnergy
    maxEnergy: 200
    energy: 200
    unsafeSupport: true
  - type: CE14MagicEnergyDraw
    energy: 1
    delay: 5
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        CE14ManaDepletion: -0.1
  - type: CE14SkillStorage
    skillPoints:
      Memory:
        max: 4
    freeLearnedSkills:
    #- SwordMastery
    - HydrosophistryT1
    - HydrosophistryT2
    - MetamagicT1
    - MetamagicT2
    - PyrokineticT1
    - CE14ActionSpellManaConsume
    - CE14ActionSpellManaGift
    - CE14ActionSpellManaConsumeElf
    - CE14ActionSpellManaGiftElf
    - CE14ActionSpellMagicSplitting
  - type: CE14SpellStorage
    grantAccessToSelf: true
    spells:
    - CE14ActionSpellCallBoneHound

