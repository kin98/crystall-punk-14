- type: entity
  id: CE14BaseWallpaper
  abstract: true
  parent: BaseItem
  description: Thin paper wallpaper. You can glue them on the walls from different sides, or peel them off with any sharp object.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _CE14/Structures/Wallpaper/icons.rsi
  - type: Stack
    count: 30

- type: entity
  id: CE14WallpaperBlack
  parent: CE14BaseWallpaper
  name: wallpaper "inkwell black"
  components:
  - type: Sprite
    state: black
  - type: CE14Wallpaper
    rsiPath: _CE14/Structures/Wallpaper/wallpaper_black.rsi
  - type: Stack
    stackType: CE14WallpaperBlack
  - type: PhysicalComposition
    materialComposition:
      CE14Cloth: 5

