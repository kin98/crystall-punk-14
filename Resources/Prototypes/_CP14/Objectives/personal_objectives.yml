- type: entity
  abstract: true
  parent: BaseObjective
  id: CE14BasePersonalObjective
  components:
  - type: Objective
    issuer: CE14-objective-issuer-personal
    difficulty: 1

- type: entity
  parent: CE14BasePersonalObjective
  abstract: true
  id: CE14BasePersonalCurrencyCollectObjective
  components:
  - type: Objective
    difficulty: 0
  - type: CE14CurrencyCollectCondition
    currency: 10
    category: Currency
    objectiveText: CE14-objective-personal-currency-collect-title
    objectiveDescription: CE14-objective-personal-currency-collect-desc
    objectiveSprite:
      sprite: /Textures/_CE14/Objects/Economy/gp_coin.rsi
      state: coin10

# Collect currency group
- type: entity
  parent: CE14BasePersonalCurrencyCollectObjective
  id: CE14PersonalCurrencyCollectObjective
  components:
  - type: Objective
    difficulty: 1
  - type: CE14CurrencyCollectCondition
    currency: 500

- type: weightedRandom
  id: CE14PersonalCurrencyCollectObjectiveGroup
  weights:
    CE14PersonalCurrencyCollectObjective: 1

