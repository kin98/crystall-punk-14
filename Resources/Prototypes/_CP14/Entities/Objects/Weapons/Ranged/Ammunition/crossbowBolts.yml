- type: entity
  parent: BaseArrow
  id: CE14BaseCrossbolt
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Ranged/Projectiles/crossbolt.rsi
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
  - type: Tag
    tags:
    - CE14CrossbowBolt

- type: entity
  parent: BaseArrow
  id: CE14BaseBigCrossbolt
