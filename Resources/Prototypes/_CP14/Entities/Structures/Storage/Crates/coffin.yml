- type: entity
  parent:
  - CE14ChestGeneric
  - CE14BaseFlammable
  id: CE14CrateCoffin
  name: coffin
  description: A comfortable and nice looking coffin to comfortably await your resurrection.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Storage/Crates/coffin.rsi
    layers:
    - state: base
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: paper
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Icon
    sprite: _CE14/Structures/Storage/Crates/coffin.rsi
    state: base
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14WoodStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14CrateCoffin
    node: CE14CrateCoffin
    containers:
    - entity_storage
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 30
      CE14Cloth: 20
  - type: EntityStorage
    capacity: 1
