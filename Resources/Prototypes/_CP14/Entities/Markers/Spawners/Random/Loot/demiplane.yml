# TIER 1

- type: entity
  parent: MarkerBase
  id: CE14SpawnerDemiplaneLootT1
  name: Demiplane T1 Loot
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _CE14/Objects/Materials/copper_bar.rsi
      state: bar_3
  - type: EntityTableSpawner
    table: !type:NestedSelector
      prob: 0.7
      tableId: CE14TableDemiplaneLootT1

- type: entityTable
  id: CE14TableDemiplaneLootT1
  table: !type:GroupSelector
    children:
    # Common
    - !type:GroupSelector
      weight: 75
      children:
      - !type:GroupSelector
        children:
        - id: CE14SpellScrollIceShards
        - id: CE14SpellScrollShadowGrab
        - id: CE14SpellScrollSphereOfLight
        - id: CE14SpellScrollCureWounds
        - id: CE14SpellScrollBloodPurification
        - id: CE14SpellScrollCureBurn
        - id: CE14SpellScrollFlameCreation
        - id: CE14SpellScrollEarthWall
        - id: CE14SpellScrollFlashLight
        - id: CE14SpellScrollWaterCreation
        - id: CE14SpellScrollMagicalAcceleration
        - id: CE14SpellScrollHeat
      - id: CE14ScrapCopper
      - id: CE14ScrapIron
    # Rare
    - !type:GroupSelector
      weight: 25
      children:
      - id: CE14BaseLockpick
      - id: CE14EnergyCrystalMediumEmpty
      - id: CE14ClothingCloakAmuletGold
      - id: CE14SpellScrollElectricTrap
      - id: CE14SpellScrollIceTrap
      # Rare standard village crates loot
      - !type:NestedSelector
        tableId: CE14StationCrateLoot

# TIER 2

- type: entity
  parent: MarkerBase
  id: CE14SpawnerDemiplaneLootT2
  name: Demiplane T2 Loot
  categories: [ ForkFiltered, DoNotMap ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _CE14/Objects/Materials/iron_bar.rsi
      state: bar_3
  - type: EntityTableSpawner
    table: !type:NestedSelector
      prob: 0.7
      tableId: CE14TableDemiplaneLootT2

- type: entityTable
  id: CE14TableDemiplaneLootT2
  table: !type:GroupSelector
    children:
    # Common
    - !type:GroupSelector
      weight: 75
      children:
      # T1 loot chance
      - !type:NestedSelector
        tableId: CE14TableDemiplaneLootT1
        weight: 2 #Temp (small amount T2 loot)
      - !type:GroupSelector
        children:
        - id: CE14SpellScrollFireTrap
        - id: CE14SpellScrollShadowStep
        - id: CE14SpellScrollFireball
        - id: CE14SpellScrollBeerCreation
          weight: 0.2
      - id: CE14ScrapGold
      - id: CE14ScrapMithril
        weight: 0.5
    # Rare
    - !type:GroupSelector
      weight: 25
      children:
      - !type:GroupSelector # remove this when players can create their own magic items
        children:
        - id: CE14ClothingCloakAmuletMana

