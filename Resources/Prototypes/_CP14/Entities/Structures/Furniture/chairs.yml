- type: entity
  name: wooden chair
  description: Made of the most common planks. Simple and effective!
  id: CE14ChairWooden
  categories: [ ForkFiltered ]
  parent:
  - UnanchoredChairBase
  - CE14BaseFlammable
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Sprite
    sprite: _CE14/Structures/Furniture/chairs.rsi
    state: wooden
  - type: Construction
    graph: CE14Seat
    node: CE14ChairWooden
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 1

