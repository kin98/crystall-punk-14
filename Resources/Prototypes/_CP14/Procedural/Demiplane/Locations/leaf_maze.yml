- type: CE14Location
  id: LeafMaze
  name: CE14-demiplane-location-leaf-maze
  icon:
    sprite: _CE14/Interface/Misc/demiplane_locations.rsi
    state: leaf_maze
  levels:
    min: 1
    max: 10
  locationConfig: CE14LeafMaze
  tags:
  - CE14DemiplaneHerbals
  - CE14DemiplaneOpenSky
  - CE14DemiplanePeacefulAnimals
  - CE14DemiplaneWater
  - CE14DemiplaneAnimalsSwamp
  components:
  - type: MapLight
    ambientLightColor: "#BFEEFFFF"
  - type: Biome
    template: CE14CavesIndestructibleFill
  - type: SunShadow
  - type: SunShadowCycle
  - type: Roof
  - type: CE14CloudShadows

- type: dungeonConfig
  id: CE14LeafMaze
  layers:
  # Masks
  - !type:NoiseDistanceDunGen
    size: 90, 90
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.9
    layers:
    - tile: CE14FloorSand
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  - !type:NoiseDistanceDunGen
    size: 60, 60
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.5
    layers:
    - tile: CE14FloorGrass
      threshold: 0.50
      noise:
        frequency: 0.030
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  # Biomes
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14LeafMaze
    tileMask:
    - CE14FloorSand
  - !type:CE14BiomeDunGen
    biomeTemplate: CE14Grassland
    tileMask:
    - CE14FloorGrass

