- type: entity
  name: wallet
  description: A small wallet, handy for storing coins.
  id: CE14Wallet
  parent: BaseStorageItem
  suffix: Empty
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: /Textures/_CE14/Objects/Economy/wallet.rsi
    layers:
    - state: wallet-0
      map: ["enum.StorageFillLayers.Fill"]
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,3,2
    quickInsert: true
    areaInsert: false
    storageOpenSound:
      collection: storageRustle
    storageInsertSound:
      collection: storageRustle
    whitelist:
      tags:
        - CE14Coin
        - Dice
  - type: UseDelay
    delay: 0.3
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: wallet
  - type: Dumpable
    soundDump:
      collection: CE14Coins
    multiplier: 0.8
  - type: Clothing
    slots: [belt]
  - type: Item
    size: Normal
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: CE14ScrapLeather
      amount: 1

- type: entity
  id: CE14WalletFilledTest
  parent: CE14Wallet
  suffix: Filled test
  components:
  - type: StorageFill
    contents:
    - id: CE14SilverCoin5
    - id: CE14SilverCoin1
    - id: CE14SilverCoin1
    - id: CE14CopperCoin
    - id: CE14CopperCoin
    - id: CE14CopperCoin

- type: entity
  id: CE14WalletFilledMerchant
  parent: CE14Wallet
  suffix: Merchant
  components:
  - type: StorageFill
    contents:
    - id: CE14GoldCoin1
    - id: CE14SilverCoin5
    - id: CE14SilverCoin1
    - id: CE14SilverCoin1
    - id: CE14CopperCoin
    - id: CE14CopperCoin
    - id: CE14CopperCoin

- type: entity
  id: CE14WalletFilledLootT1
  parent: CE14Wallet
  categories: [ HideSpawnMenu ]
  components:
  - type: StorageFill
    contents:
    - id: CE14GoldCoin1
      prob: 0.001
      orGroup: ZombieLootT1
    - id: CE14SilverCoin5
      prob: 0.1
      orGroup: ZombieLootT1
    - id: CE14SilverCoin1
      prob: 0.3
      orGroup: ZombieLootT1
    - id: CE14CopperCoin5
      prob: 0.6
      orGroup: ZombieLootT1
    - id: CE14CopperCoin1
      orGroup: ZombieLootT1
