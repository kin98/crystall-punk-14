- type: entity
  parent: BaseItem
  id: CE14FloorTileItemBase
  name: carpet
  description: Rolled up carpet for easy transport.
  abstract: true
  components:
  - type: Stack
    count: 1
  - type: Sprite
    sprite: _CE14/Structures/Furniture/Carpets/icons.rsi
  - type: StackPrice
    price: 0.5
  - type: SpawnAfterInteract 
    doAfter: 0.5
    removeOnInteract: true

- type: entity
  name: blue carpet
  parent: CE14FloorTileItemBase
  id: CE14FloorCarpetItemBlue1
  categories: [ ForkFiltered ]
  suffix: Blue
  components:
