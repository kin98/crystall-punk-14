- type: constructionGraph
  id: CE14WallmountBarShelfA
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CE14WallmountBarShelfA
          steps:
            - stackGroup: WoodenPlanks
              amount: 2
              doAfter: 2
    - node: CE14WallmountBarShelfA
      entity: CE14WallmountBarShelfA
      edges:
      - to: start
        steps:
        - tool: Screwing
          doAfter: 0.5
        - tool: Prying
          doAfter: 1
        completed:
        - !type:SpawnPrototype
          prototype: CE14WoodenPlanks1
          amount: 2

