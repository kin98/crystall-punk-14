- type: entity
  id: CE14ActionSpellSprint
  parent: CE14ActionSpellBase
  name: Sprint
  description: At the cost of heavy stamina expenditure, you accelerate significantly in movement.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 1.3
  - type: CE14ActionStaminaCost
    stamina: 2.0
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 0.25
  - type: Action
    useDelay: 2
    sound: null
    icon:
      sprite: _CE14/Actions/Spells/physical.rsi
      state: sprint
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14DustEffect

- type: entity
  id: CE14ActionBearSpellSprint
  parent: CE14ActionSpellSprint
  description: Catch up and rip, every predator can accelerate and catch up with its prey.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 1.8