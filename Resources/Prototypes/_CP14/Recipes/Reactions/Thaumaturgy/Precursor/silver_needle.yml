
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14DayflinSilverNeedle
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14SilverNeedle:
      amount: 1
  products:
    CE14EssenceFrost: 0.5
    CE14EssenceLife: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

- type: reaction
  id: CE14SilverNeedleAdmixture1
  minTemp: 500
  reactants:
    CE14SilverNeedle:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14PositiveEffectHealMana:
      amount: 1
  products:
    CE14HealingEffectHealCold: 2
    CE14NegativeEffectSpeedDown: 1
