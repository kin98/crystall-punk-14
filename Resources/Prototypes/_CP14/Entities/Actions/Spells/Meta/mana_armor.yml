- type: entity
  id: CE14ActionSpellMagicArmor
  parent: CE14ActionSpellBase
  name: Magic Armor
  description: You surround the target with a short-lived magical barrier that absorbs some of the damage it receives.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 15
  - type: DoAfterArgs
    delay: 1.0
    breakOnDamage: true
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneManaTrance
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: magic_armor
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Item
      - Anchorable
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaGift
      - !type:CE14SpellApplyStatusEffect
        statusEffect: CE14StatusEffectMagicArmor
        duration: 20
