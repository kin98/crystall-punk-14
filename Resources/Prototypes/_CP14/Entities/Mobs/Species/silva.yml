- type: entity
  parent: CE14BaseMobSpeciesOrganic
  id: CE14BaseMobSilva
  name: Mr. Silva
  abstract: true
  components:
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      shader: unshaded # Gloving eyes
    - map: [ "vampire_fangs" ]
      sprite: _CE14/Mobs/Species/Vampire/fangs.rsi
      state: human
      visible: false
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - shader: StencilClear
      sprite: _CE14/Mobs/Species/Human/parts.rsi
      state: l_leg
    - map: [ "enum.HumanoidVisualLayers.Tail" ] # Body Bark before clothing
    - shader: StencilMask
      map: [ "enum.HumanoidVisualLayers.StencilMask" ]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: unisex_full
      visible: false
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "pants" ]
    - map: [ "shoes" ]
    - map: [ "shirt" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ] # Bark Before clothing
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ] # Bark Before clothing
    - map: [ "gloves" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "cloak" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "belt2" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: HumanoidAppearance
    species: CE14Silva
  - type: Icon
    sprite: _CE14/Mobs/Species/Elf/parts.rsi #TODO
    state: full
  - type: CE14SkillStorage #Innate vivification
    freeLearnedSkills:
    - HealingT1
    - HealingT2
  - type: CE14MagicEnergyPhotosynthesis # Silva special feature #Disabled until sunlight fixed
  - type: CE14MagicEnergyDraw
    enable: false
  - type: Body
    prototype: CE14Silva
    requiredLegs: 2
  - type: CE14AuraImprint
    imprintColor: "#31cc3b"
  - type: Bloodstream
    bloodReagent: CE14BloodFlowerSap #Lol
  - type: Inventory
    templateId: CE14Human
    displacements:
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      pants:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Elf/displacement.rsi
            state: male_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_neck
          48:
            sprite: _CE14/Mobs/Species/Human/displacement48.rsi
            state: female_neck
    femaleDisplacements:
      outerClothing:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      cloak:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      gloves:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_cloak
      pants:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_pants
      shirt:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Elf/displacement.rsi
            state: female_shirt
      neck:
        sizeMaps:
          32:
            sprite: _CE14/Mobs/Species/Human/displacement.rsi
            state: female_neck
          48:
            sprite: _CE14/Mobs/Species/Human/displacement48.rsi
            state: female_neck

