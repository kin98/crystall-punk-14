- type: entity
  id: CE14DirtBlock1
  parent: BaseItem
  name: dirt block
  description: A block of excellent black soil.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Sprite
    noRot: true
    sprite: _CE14/Objects/Materials/dirt_block.rsi
    layers:
      - state: dirt
        map: ["base"]
  - type: FloorTile
    placeTileSound:
      collection: CE14Digging
      params:
        variation: 0.03
        volume: 2
    outputs:
      - CE14FloorDirt
  - type: Appearance
  - type: Stack
    stackType: CE14Dirt
    count: 1
    baseLayer: base
    layerStates:
    - dirt
    - dirt_2
    - dirt_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      CE14Dirt: 10
  - type: CE14MagicEssenceContainer
    essences:
      Earth: 1

- type: entity
  id: CE14DirtBlock10
  parent: CE14DirtBlock1
  suffix: 10
  components:
  - type: Stack
    count: 10

