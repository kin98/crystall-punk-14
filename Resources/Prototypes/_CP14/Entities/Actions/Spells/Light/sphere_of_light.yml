- type: entity
  id: CE14ActionSpellSphereOfLight
  parent: CE14ActionSpellBase
  name: Sphere of Light
  description: Materialization of a bright and safe light source.
  components:
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionSpeaking
    startSpeech: "Appare in manu tua..."
    endSpeech: "sphaera lucis"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneSphereOfLight
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/light.rsi
      state: sphere_of_light
  - type: DoAfterArgs
    delay: 0.5
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
      - Item
      - Anchorable
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectSphereOfLight
      - !type:CE14SpellApplyStatusEffect
        statusEffect: CE14StatusEffectGlowing
        duration: 120

- type: entity
  id: CE14RuneSphereOfLight
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#efedff"
  - type: Sprite
    layers:
    - state: sun
      color: "#efedff"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectSphereOfLight
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#efedff"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollLight
  id: CE14SpellScrollSphereOfLight
  name: sphere of light spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellSphereOfLight