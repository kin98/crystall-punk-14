
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14AirLilySplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14AirLily:
      amount: 1
  products:
    CE14EssenceAir: 0.5
    CE14EssenceWater: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

# Emote cough -> Heal airloss

- type: reaction
  id: CE14AirLilyAdmixture
  minTemp: 500
  reactants:
    CE14AirLily:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14SideEffectEmoteCough:
      amount: 1
  products:
    CE14HealingEffectHealAirloss: 2
    CE14SideEffectDrunk: 1

