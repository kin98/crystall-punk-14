- type: entity
  id: CE14ActionSpellLurkerStep
  parent: CE14ActionSpellBase
  name: Shadow step
  description: A step through the gash of reality that allows you to cover a small of distance quickly.
  components:
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneLurkerFear
  - type: DoAfterArgs
    delay: 1.0
    hidden: true
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/lurker.rsi
      state: step
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectLurkerStep
      effects:
      - !type:CE14SpellCasterTeleport
        needVision: false
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14LurkerRitualSound

- type: entity
  id: CE14ImpactEffectLurkerStep
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: wave_up
      color: "#2b2c32"
