- type: entity
  id: CE14ActionSpellCureWounds
  parent: CE14ActionSpellBase
  name: Cure wounds
  description: You heal the target from physical damage
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 10
  - type: DoAfterArgs
    delay: 1.5
    breakOnDamage: true
  - type: CE14ActionSpeaking
    startSpeech: "Et curabuntur..."
    endSpeech: "vulnera tua"
  - type: CE14ActionTargetMobStatusRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneCureWounds
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/healing.rsi
      state: cure_wounds
  - type: TargetAction
    range: 7
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectCureWounds
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectCureWounds
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          damage:
            types:
              Slash: -10
              Blunt: -10
              Piercing: -10
        - !type:Jitter
        - !type:ModifyBleedAmount
          amount: -5

- type: entity
  id: CE14RuneCureWounds
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#328643"
  - type: Sprite
    layers:
    - state: sun
      color: "#79b330"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectCureWounds
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#79b330"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollHealing
  id: CE14SpellScrollCureWounds
  name: cure wounds spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellCureWounds
