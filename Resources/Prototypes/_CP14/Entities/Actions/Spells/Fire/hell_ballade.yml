- type: entity
  id: CE14ActionSpellHellBallade
  parent: CE14ActionSpellBase
  name: Hell ballade
  description: Your music is infused with the power of fire and literally burns you and your enemies up.
  components:
  - type: Sprite
    sprite: _CE14/Actions/Spells/fire.rsi
    state: fire_music
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 8
  - type: CE14ActionRequiredMusicTool
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneHellBallade
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 1
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 15
    sound: null
    icon:
      sprite: _CE14/Actions/Spells/fire.rsi
      state: fire_music
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellArea
        range: 3
        maxTargets: 4
        whitelist:
          components:
          - MobState
        effects:
        - !type:CE14SpellSpawnEntityOnTarget
          spawns:
          - CE14ImpactEffectHellBallade
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:Jitter
          - !type:FlammableReaction
            multiplier: 0.5
          - !type:AdjustTemperature
            amount: 500
          - !type:Ignite

- type: entity
  id: CE14ImpactEffectHellBallade
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_5
      color: "#eea911"
      shader: unshaded

- type: entity
  id: CE14RuneHellBallade
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_3
      color: "#eea911"
      shader: unshaded
