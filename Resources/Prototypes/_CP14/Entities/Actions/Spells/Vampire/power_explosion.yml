- type: entity
  id: CE14ActionSpellVampirePower3
  parent: CE14ActionSpellBase
  name: Impulse
  description: By unleashing the power of your ancient vampire clan, you repel everyone and everything around you, stunning them for a long time.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.4
  - type: CE14MagicEffectVampire
  - type: CE14ActionManaCost
    manaCost: 50
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 60
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: power_kick_3
    sound: !type:SoundPathSpecifier
      path: /Audio/_CE14/Effects/essence_consume.ogg
  - type: DoAfterArgs
    delay: 1.5
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnUser
        spawns:
        - CE14ImpactEffectVampireKick #TODO
      - !type:CE14SpellArea
        range: 2
        maxTargets: 16
        affectCaster: false
        whitelist:
          components:
          - Body
          - Item
          - Anchorable
        effects:
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:Paralyze
            paralyzeTime: 2
        - !type:CE14SpellThrowFromUser
          throwPower: 15
        - !type:CE14SpellSpawnEntityOnTarget
          clientside: true
          spawns:
          - CE14ImpactEffectBloodStep
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:HealthChange
            ignoreResistances: false
            damage:
              types:
                Blunt: 10