- type: entity
  id: CE14WallmountFlagBase
  abstract: true
  parent:
  - CE14BaseWallmount
  - CE14BaseFlammableSpreadingStrong
  categories: [ ForkFiltered ]
  name: tapestry
  description: A piece of cloth pinned to the wall.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Decoration/flags_wallmount.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14Cloth1:
            min: 1
            max: 2

# Mercenary

- type: entity
  parent: CE14WallmountFlagBase
  id: CE14WallmountFlagAlchemist
  name: alchemist tapestry
  description: A tapestry with a potion symbol indicating that alchemists dwell here.
  components:
  - type: Sprite
    layers:
    - state: fill_mercenary
    - state: icon_potion

- type: entity
  parent: CE14WallmountFlagBase
  id: CE14WallmountFlagBlacksmith
  name: blacksmith tapestry
  description: A tapestry with an anvil symbol indicating that blacksmiths dwell here.
  components:
  - type: Sprite
    layers:
    - state: fill_mercenary
    - state: icon_anvil

- type: entity
  parent: CE14WallmountFlagBase
  id: CE14WallmountFlagTavern
  name: tavern tapestry
  description: A tapestry with a beer symbol indicating that the tavern is here.
  components:
  - type: Sprite
    layers:
    - state: fill_mercenary
    - state: icon_tavern

# Bank

- type: entity
