- type: entity
  id: CE14ActionSpellManaGift
  parent: CE14ActionSpellBase
  name: Mana transfer
  description: You can transfer a small amount of your magical energy to a target entity or magical object.
  components:
  - type: CE14ActionManaCost
    manaCost: 10
    canModifyManacost: false
  - type: DoAfterArgs
    repeat: true
    breakOnMove: true
    delay: 1
    breakOnDamage: true
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneManaGift
  - type: Action
    useDelay: 2
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: mana_gift
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - CE14MagicEnergyContainer
      - CE14MagicEnergyCrystalSlot
    canTargetSelf: true
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaGift
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaGift
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:CE14ManaChange
          manaDelta: 10
          safe: false

- type: entity
  id: CE14ActionSpellManaGiftElf
  parent: CE14ActionSpellManaGift
  name: Carefull mana transfer
  description: You transfer mana at a tremendous rate without dealing damage to the target.
  components:
  - type: CE14ActionManaCost
    manaCost: 20
  - type: EntityTargetAction
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaGift
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:CE14ManaChange
          manaDelta: 20
          safe: true

- type: entity
  id: CE14RuneManaGift
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5096d4"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#5096d4"
      shader: unshaded
    - state: double_outer
      color: "#5096d4"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectManaGift
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5096d4"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollMeta
  id: CE14SpellScrollManaGift
  name: mana gift spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellManaGift

