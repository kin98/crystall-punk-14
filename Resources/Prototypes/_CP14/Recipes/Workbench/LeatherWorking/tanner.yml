# Crafting Recipes
# Hide Crafting
- type: CE14Recipe
  id: CE14ScrapHideRecipe
  tag: CE14RecipeLeatherWorking
  category: LeatherWorking
  craftTime: 2
  requirements:
  - !type:ProtoIdResource
    protoId: CE14ScrapLeather
    count: 3 # 3x scraps (9u total)
  - !type:ProtoIdResource
    protoId: CE14String
    count: 1 # 5u cloth
  result: CE14Leather1
  # Cost: (15×1.2) + (5×0.3) = 18 + 1.5 = 19.5 copper coins

- type: CE14Recipe
  id: CE14ThinToRegularHideRecipe
  tag: CE14RecipeLeatherWorking
  category: LeatherWorking
  craftTime: 2
  requirements:
  - !type:StackResource
    stack: CE14ThinLeather # 5u
    count: 2 # 10u CE14Leather
  - !type:ProtoIdResource
    protoId: CE14String
    count: 1 # 5u cloth
  result: CE14Leather1 # 1x hide (10u)
  # Cost: (10×1.2) + (5×0.3) = 12 + 1.5 = 13.5 copper coins
