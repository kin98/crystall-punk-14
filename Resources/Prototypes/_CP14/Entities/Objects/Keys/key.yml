- type: entity
  parent: BaseItem
  id: CE14BaseKey
  abstract: true
  categories: [ ForkFiltered ]
  name: key
  description: A small, intricate piece of metal that opens some locks. Don't give it to anyone!
  components:
  - type: Tag
    tags:
    - CE14Key
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE14/Objects/keys.rsi
  - type: CE14Key
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_CE14/Items/key_drop.ogg
      params:
        variation: 0.05

- type: entity
  parent: CE14BaseKey
  id: CE14KeyCopperBlank
  components:
