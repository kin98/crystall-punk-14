# Simple recipes made from T0 and T1 essences and water
# T1
# The result is always 75% empty solution

- type: reaction
  id: CE14WaterBrewingSatiateHunger
  minTemp: 500
  priority: 2
  reactants:
    CE14EssenceBeast:
      amount: 2
    CE14EssenceLife:
      amount: 1
    Water:
      amount: 1
  products:
    CE14SideEffectEmpty: 2
    CE14SideEffectEmoteCough: 1
    CE14PositiveEffectSatiateHunger: 1
  effects:
  - !type:CE14AffectSolutionTemperature
    addTemperature: -150

