- type: entity
  id: CE14PlantPepper
  parent: CE14GatherablePlantMultiHarvestBase
  name: pepper
  description: Russian roulette. Are you hot, or are you sweet peppers?
  components:
  - type: Sprite
    layers:
    - state: liq-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
    - state: grow-1
      sprite: _CE14/Structures/Flora/Farm/pepper.rsi
      map: ["enum.PlantVisualLayers.Base"]
  - type: CE14PlantVisuals
    growthSteps: 5
  - type: CE14PlantGatherable
    loot:
      All: !type:AllSelector
        children:
        - id: CE14FoodPepper
          rolls: !type:RangeNumberSelector
            range: 4, 6
        - id: CE14SeedPepper
          rolls: !type:RangeNumberSelector
            range: 1, 2

