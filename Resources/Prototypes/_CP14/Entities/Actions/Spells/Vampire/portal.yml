- type: entity
  id: CE14ActionSpellPortalToVampireHome
  parent: CE14ActionSpellBase
  name: Teleport to the vampire lair
  description: You open a portal leading to the location of your clan's portal glyph. The portal will disappear in 30 seconds. If the glyph is not constructed, the portal will be chaotic, teleporting players in different directions.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 30
  - type: DoAfterArgs
    delay: 2
    breakOnMove: true
    breakOnDamage: true
  - type: Action
    useDelay: 60
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: portal
  - type: TargetAction
    range: 3
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodEssence
      effects:
      - !type:CE14SpellTeleportToVampireSingleton