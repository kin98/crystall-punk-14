- type: entity
  parent: CE14BaseGameRule
  id: CE14GameRuleVampireClanBattleTriple
  components:
  - type: CE14VampireRule
  - type: GameRule
    minPlayers: 30
  - type: SubGamemodes
    rules:
    - id: CE14GameRuleVampireClanUnnameable
    - id: CE14GameRuleVampireClanDevourers
    - id: CE14GameRuleVampireClanNightChildrens

- type: entity
  parent: CE14BaseGameRule
  id: CE14GameRuleVampireClanBattleDouble
  components:
  - type: CE14VampireRule
  - type: GameRule
    minPlayers: 20
  - type: SubGamemodes
    rules:
    - id: CE14GameRuleVampireClanDevourers
    - id: CE14GameRuleVampireClanNightChildrens

- type: entity
  parent: CE14BaseGameRule
  id: CE14GameRuleVampireClanUnnameable
  components:
  - type: AntagObjectives
    objectives:
    - CE14VampireObjectiveBloodPurity
    - CE14VampireObjectiveDefenseVillage
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ CE14Vampire ]
      min: 1
      max: 3
      playerRatio: 2
      lateJoinAdditional: true
      mindRoles:
      - CE14MindRoleVampire
      components:
      - type: CE14Vampire
        faction: Unnameable
      - type: CE14ShowVampireFaction
        faction: Unnameable
      - type: Hunger
        hungerThresholdAlerts:
          Peckish: CE14VampirePeckish
          Starving: CE14VampireStarving
          Dead: CE14VampireStarving
        starvingSlowdownModifier: 1.1 #Speed Up when hunger!
      - type: PassiveDamage
        allowedStates:
        - Alive
        - Critical
        damage:
          groups:
            Brute: -3
      briefing:
        text: CE14-roles-antag-vampire-briefing-unnameable
        color: "#630f24"
        sound: "/Audio/_CE14/Ambience/Antag/vampire.ogg"

