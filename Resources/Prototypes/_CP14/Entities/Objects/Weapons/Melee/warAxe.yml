- type: entity
  abstract: true
  id: CE14BaseWeaponWarAxe
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 0.6
    range: 1.6
    angle: 170 #Bigger in 2 times
    wideAnimationRotation: -90
    damage:
      types:
        Slash: 10
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.5
    cPAnimationOffset: 1
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 15
  - type: CE14MeleeWeaponStaminaCost
    stamina: 10
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    breakOnMove: false
    equipDelay: 1
    unequipDelay: 1

- type: entity
  parent: CE14BaseWeaponWarAxe
  id: CE14WeaponWarAxeIron
  name: iron war axe
  description: A heavy war axe made of iron, designed for powerful strikes in battle.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/WarAxe/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 20
      CE14Iron: 20
