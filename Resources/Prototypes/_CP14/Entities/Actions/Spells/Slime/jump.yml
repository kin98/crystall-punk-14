- type: entity
  id: CE14ActionSpellSlimeJump
  name: Slime jump
  description: Jump! JUMP!
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.1
  - type: DoAfterArgs
    delay: 1
    hidden: true
  - type: Action
    itemIconStyle: BigAction
    useDelay: 8
    icon:
      sprite: _CE14/Actions/Spells/slime.rsi
      state: jump
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      effects:
      - !type:CE14SpellThrowUserTo
        throwPower: 8
