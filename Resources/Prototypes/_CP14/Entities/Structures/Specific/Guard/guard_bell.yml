- type: entity
  parent: BaseStructure
  id: CE14BaseGuardBell
  name: guard bell
  description: A strong bell to alert the entire settlement of a possible threat.
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    offset: 0, 0.2
    sprite: _CE14/Structures/Specific/Guard/guard_bell.rsi
    layers:
    - state: base
  - type: Damageable
    damageContainer: Inorganic
  - type: TriggerOnActivate
  - type: CE14TriggerOnDamageReceived
  - type: SpawnOnTrigger
    proto: GuardBellEffect1
  - type: UseDelay
    delay: 2.0

- type: entity
  id: CE14GuardBell
  parent: CE14BaseGuardBell
  components:
  - type: Sprite
    layers:
    - state: base
  - type: SpawnOnTrigger
    proto: CE14GuardBellEffect1

- type: entity
  id: CE14GuardBell2
  parent: CE14BaseGuardBell
  components:
  - type: Sprite
    layers:
    - state: base-2
  - type: SpawnOnTrigger
    proto: CE14GuardBellEffect2

- type: entity
  id: CE14GuardBell3
  parent: CE14BaseGuardBell
  components:
  - type: Sprite
    layers:
    - state: base-3
  - type: SpawnOnTrigger
    proto: CE14GuardBellEffect3

- type: entity
  id: CE14GuardBell4
  parent: CE14BaseGuardBell
  components:
  - type: Sprite
    layers:
    - state: base-4
  - type: SpawnOnTrigger
    proto: CE14GuardBellEffect4

# Effects
- type: entity
  id: CE14BaseGuardBellEffect
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: CE14PvsOverride
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE14/Misc/scary-bell-short.ogg
      params:
        variation: 0.1
        maxDistance: 200
  - type: TimedDespawn
    lifetime: 4.8
  - type: Sprite
    drawdepth: Effects
    offset: 0, 0.5
    layers:
    - state: circle_increase
      sprite: _CE14/Effects/Magic/cast_impact.rsi
      shader: unshaded

- type: entity
  id: CE14GuardBellEffect1
  parent: CE14BaseGuardBellEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE14/Misc/scary-bell-short.ogg
      params:
        variation: 0.1
        maxDistance: 200

- type: entity
  id: CE14GuardBellEffect2
  parent: CE14BaseGuardBellEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE14/Misc/doom-bell-short.ogg
      params:
        variation: 0.1
        maxDistance: 200

- type: entity
  id: CE14GuardBellEffect3
  parent: CE14BaseGuardBellEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE14/Misc/minor-alert-short.ogg
      params:
        volume: 20
        variation: 0.1
        maxDistance: 200

- type: entity
  id: CE14GuardBellEffect4
  parent: CE14BaseGuardBellEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CE14/Misc/major-alert-short.ogg
      params:
        variation: 0.1
        maxDistance: 200
