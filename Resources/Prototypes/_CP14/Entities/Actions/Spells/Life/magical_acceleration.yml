- type: entity
  id: CE14ActionSpellMagicalAcceleration
  parent: CE14ActionSpellBase
  name: Magical acceleration
  description: At the cost of magic energy, you significantly accelerate your movement speed
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 1.3
  - type: CE14ActionManaCost
    manaCost: 3
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 0.25
  - type: Action
    useDelay: 2
    icon:
      sprite: _CE14/Actions/Spells/misc.rsi
      state: magical_acceleration
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14MagicAccelerationDustEffect

- type: entity
  id: CE14MagicAccelerationDustEffect
  parent: CE14DustEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _CE14/Effects/dust.rsi
    layers:
    - state: dust
      shader: unshaded
      color: "#4097bd"
  - type: PointLight
    color: "#4097bd"

- type: entity
  parent: CE14BaseSpellScrollHealing
  id: CE14SpellScrollMagicalAcceleration
  name: magical accseleration spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellMagicalAcceleration
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
            CE14Ash1:
              min: 1
              max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

