- type: entity
  id: CE14ActionSpellSheepPolymorph
  parent: CE14ActionSpellBase
  name: Sheep polymorph
  description: You curse the target, turning it into a silly sheep for a short period of time.
  components:
  - type: Sprite
    sprite: _CE14/Actions/Spells/misc.rsi
    state: polymorph
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 30
  - type: CE14ActionSpeaking
    startSpeech: "Pascam et custodiam..."
    endSpeech: "pecora tua"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneSheepPolymorph
  - type: CE14ActionTargetMobStatusRequired
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/misc.rsi
      state: polymorph
  - type: TargetAction
    range: 3
    interactOnMiss: false
  - type: DoAfterArgs
    delay: 1.5
    breakOnDamage: true
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectSheepPolymorph
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectSheepPolymorph
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:Polymorph
          prototype: CE14Sheep

- type: entity
  id: CE14RuneSheepPolymorph
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#8532a8"
  - type: Sprite
    layers:
    - state: sun
      color: "#8532a8"
      shader: unshaded
    - state: double_outer
      color: "#db35c8"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectSheepPolymorph
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#db35c8"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollHealing
  id: CE14SpellScrollSheepPolymorph
  name: sheep polymorph spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellSheepPolymorph
