- type: entity
  id: CE14GatherableBloodFlower
  parent: CE14GatherableBase
  name: blood rose
  description: Scarlet flowers growing where blood has been spilled.
  suffix: Gatherable
  components:
  - type: Sprite
    drawdepth: FloorTiles
    sprite: _CE14/Structures/Flora/Wild/blood_flower.rsi
    layers:
      - state: world1
        map: ["random"]
  - type: RandomSprite
    available:
    - random:
        world1: ""
        world2: ""
        world3: ""
  - type: CE14PlantGatherable
    deleteAfterHarvest: true
    loot:
      All: !type:GroupSelector
        children:
        - id: CE14BloodFlower

