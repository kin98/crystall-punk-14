- type: constructionGraph
  id: CE14Snowdrift
  start: start
  graph:
    - node: start
      entity: CE14Snowdrift
      edges:
        - to: CE14Snowdrift
          steps:
            - tool: CE14Digging
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CE14Snowball
              amount: 3
            - !type:SpawnPrototype
              prototype: CE14SnowEffect
              amount: 1
            - !type:PlaySound
              sound: /Audio/_CE14/Effects/snowball.ogg
            - !type:DeleteEntity {}
    - node: CE14Snowdrift

