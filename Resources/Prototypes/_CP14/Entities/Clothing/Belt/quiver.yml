- type: entity
  parent: ClothingBeltStorageBase
  id: CE14ClothingBeltQuiver
  name: quiver
  description: Holds many crossbow bolts, and fits snug around your waist.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE14/Clothing/Belt/quiver.rsi
    layers:
    - state: icon
    - map: [ "enum.StorageContainerVisualLayers.Fill" ]
      visible: false
  - type: Clothing
    equipDelay: 0.45
    unequipDelay: 0.45
    quickEquip: false
    breakOnMove: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Small
    whitelist:
      tags:
      - CE14CrossbowBolt
      - CE14Arrow
      - CE14BigCrossbowBolt
  - type: Appearance
  - type: StorageContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
  - type: PhysicalComposition
    materialComposition:
      CE14Leather: 20 # 20u CE14Leather (2x10u)
      CE14Cloth: 20 # 20u CE14String (4x5u)
  # Cost: (20×1.2) + (20×0.3) = 24 + 6 = 30 copper coins

- type: entity
  parent: CE14ClothingBeltQuiver
  id: CE14ClothingBeltQuiverArrows
  categories: [ ForkFiltered ]
  suffix: Filled with arrows
  components:
  - type: StorageFill
    contents:
    - id: CE14Arrow
      amount: 16
