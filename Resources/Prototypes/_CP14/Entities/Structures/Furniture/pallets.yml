- type: entity
  id: CE14BasePallets
  abstract: true
  categories: [ ForkFiltered ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _CE14/Structures/Furniture/pallets.rsi
    snapCardinals: true
    drawdepth: FloorTiles
  - type: Transform
    anchored: true
  - type: Tag
    tags:
      - Catwalk

- type: entity
  id: CE14WoodenPallet
  parent:
  - CE14BasePallets
  - CE14BaseFlammable
  name: wooden pallet
  description: Wooden goods stand.
  components:
  - type: Sprite
    state: wooden
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14WoodenPallet
    node: CE14WoodenPallet

- type: entity
  id: CE14WoodenPalletSell
  parent: CE14WoodenPallet
  name: selling wooden pallet
  components:
  - type: Sprite
    layers:
    - state: wooden
    - state: sell

- type: entity
  id: CE14WoodenPalletBuy
  parent: CE14WoodenPallet
  name: buying wooden pallet
  components:
  - type: Sprite
    layers:
    - state: wooden
    - state: buy
