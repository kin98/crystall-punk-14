  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1.5
    range: 1.2
    angle: 60
    wideAnimationRotation: -90
    damage:
      types:
        Slash: 5
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.25
    cPAnimationOffset: 1
  - type: CE14ComboBonusMeleeDamage
    bonusDamage:
      types:
        Piercing: 5
  - type: Clothing
    slots:
