- type: entity
  id: CE14BaseGameRule
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    CE14Allowed: true

- type: entity
  id: CE14RoundObjectivesRule
  parent: CE14BaseGameRule
  components:
  - type: CE14PersonalObjectivesRule
    roleObjectives:
      CE14Adventurer:
      - CE14PersonalCurrencyCollectObjectiveGroup
      CE14Alchemist:
      - CE14PersonalCurrencyCollectObjectiveGroup
      CE14Apprentice:
      - CE14PersonalCurrencyCollectObjectiveGroup
      CE14Blacksmith:
      - CE14PersonalCurrencyCollectObjectiveGroup
      CE14Innkeeper:
      - CE14PersonalCurrencyCollectObjectiveGroup

