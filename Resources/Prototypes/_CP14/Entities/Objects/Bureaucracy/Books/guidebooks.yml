- type: entity
  id: CE14GuidebookImperialLaws
  parent: CE14GuidebookBase
  name: imperial laws
  description: A book about Imperial Laws.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#1f389c"
    - state: decor_frame
      color: "#38f0b3"
    - state: icon_plate
      color: "#f5ba56"
    - state: bookmark_short
  - type: GuideHelp
    guides:
    - CE14_RU_Imperial_Laws
    - CE14_EN_Imperial_Laws

- type: entity
  id: CE14GuidebookAlchemy
  parent: CE14GuidebookBase
  name: achimist's handbook
  description: The mysteries of liquids and magic are hidden in this book.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#3b8065"
    - state: decor_frame
      color: "#ffe269"
    - state: icon_plate
      color: "#4eabbf"
    - state: bookmark_short
  - type: GuideHelp
    guides:
    - CE14_RU_Alchemy
    - CE14_EN_Alchemy

- type: entity
  id: CE14GuidebookCooking
  parent: CE14GuidebookBase
  name: cookbook
  description: A book about cooking, created by unknown Silva innkeeper.
  components:
  - type: Sprite
    layers:
    - state: paper
    - state: cover_base
      color: "#9d9d97"
      map: [ "cover" ]
    - state: decor_frame
      color: "#9d9d97"
      map: [ "decor" ]
    - state: icon_moon
      map: [ "icon" ]
    - state: bookmark_short
      map: [ "overlay" ]
  - type: GuideHelp
    guides:
    - CE14_EN_Cooking
    - CE14_RU_Cooking
