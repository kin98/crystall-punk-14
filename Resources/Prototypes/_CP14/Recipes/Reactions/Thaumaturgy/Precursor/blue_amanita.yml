
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14BlueAmanitaSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BlueAmanita:
      amount: 1
  products:
    CE14EssenceMagic: 0.5
    CE14EssenceWater: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

- type: reaction
  id: CE14BlueAmanitaAdmixture
  minTemp: 500
  reactants:
    CE14BlueAmanita:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14SideEffectRainbow:
      amount: 1
  products:
    CE14PositiveEffectHealMana: 2
    CE14SideEffectDrunk: 1

