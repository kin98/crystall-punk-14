- type: biomeTemplate
  id: CE14SnowFill
  layers:
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CE14FloorSnowDeepDeep
    - !type:BiomeTileLayer
      tile: CE14FloorSnowDeep
      threshold: 0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.02
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
    - !type:BiomeTileLayer
      tile: CE14FloorSnow
      threshold: 0.45
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.02
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120

- type: biomeTemplate
  id: CE14Snowland
  layers:
    - !type:BiomeMetaLayer
      template: CE14SnowFill
    - !type:BiomeEntityLayer # Snowdrifts
      threshold: 0.3
      noise:
        seed: 23
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14Snowdrift
    - !type:BiomeEntityLayer # Rare Trees
      threshold: 0.8
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14FloraTreeSnow
        #- CE14FloraTreeGreenLarge

# Subbiomes

# Forest

- type: biomeTemplate
  id: CE14SnowlandForest
  layers:
    - !type:BiomeMetaLayer
      template: CE14Snowland
    - !type:BiomeEntityLayer # More Trees
      threshold: 0.2
      noise:
        seed: 4
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14FloraTreeDead
        - CE14FloraTreeSnow
        - CE14FloraTreeDeadSmall
        #- CE14FloraTreeGreenLarge

# Hills

- type: biomeTemplate
  id: CE14SnowlandHills # Холмы
  layers:
    - !type:BiomeMetaLayer
      template: CE14SnowlandForest
    - !type:BiomeTileLayer
      tile: CE14FloorBase
      invert: true
      threshold: 0.5
      noise:
        seed: 6
        noiseType: OpenSimplex2
        frequency: 0.03
        lacunarity: 2
        fractalType: Ridged
        octaves: 1
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance
        cellularJitterModifier: 0.7
        domainWarpType: OpenSimplex2Reduced
        domainWarpAmp: 285
    - !type:BiomeEntityLayer # Walls
      allowedTiles:
        - CE14FloorBase
      threshold: -1.0
      entities:
        - CE14WallSnow

# Frozen swamp

- type: biomeTemplate
  id: CE14SnowlandSwamp
  layers:
    - !type:BiomeMetaLayer
      template: CE14Snowland
    - !type:BiomeTileLayer
      tile: CE14FloorIce
      threshold: 0.0
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1
    - !type:BiomeEntityLayer # More Trees
      threshold: 0.2
      noise:
        seed: 4
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14FloraTreeSnow
        #- CE14FloraTreeGreenLarge

- type: biomeTemplate
  id: CE14SnowlandTestResult
  layers:
    - !type:BiomeMetaLayer
      template: CE14Snowland
    - !type:BiomeMetaLayer
      template: CE14SnowlandForest
      threshold: 0.2
      noise:
        seed: 18
        frequency: 0.02
        fractalType: None
    - !type:BiomeMetaLayer
      template: CE14SnowlandHills
      threshold: 0.4
      noise:
        seed: 14
        frequency: 0.02
        fractalType: None

