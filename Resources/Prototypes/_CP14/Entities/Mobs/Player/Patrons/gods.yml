  #  uis:
  #    enum.CE14ReligionEntityUiKey.Key:
  #      toggleAction: CE14ActionSpellGodLumeraWarp
  #- type: CE14ReligionSpeaker
  #  speaker: CE14LumeraSpeakImpact
  - type: CE14PriceScanner
  - type: SolutionScanner