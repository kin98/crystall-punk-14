    LFoot: CE14MobCarcatLFoot
    RFoot: CE14MobCarcatRFoot

- type: markingPoints
  id: CE14MobCarcatMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 1
      required: false
    #FacialHair:
    #  points: 1
    #  required: false
    Snout:
      points: 1
      required: true
      defaultMarkings: [ CE14CarcatNose ]
    Tail:
      points: 1
      required: true
      defaultMarkings: [ CE14CarcatTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ CE14CarcatEars ]
    #Chest:
    #  points: 1
    #  required: false
    #Legs:
    #  points: 2
    #  required: false
    #Arms:
    #  points: 2
    #  required: false

