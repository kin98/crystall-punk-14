# Stone brick

- type: entity
  id: CE14WallFrameStonebrick
  name: stone brick wall base
  parent: CE14BaseWallFrame
  components:
  - type: Sprite
    sprite: _CE14/Structures/Walls/bricks_stone_wall.rsi
    state: frame
  - type: Icon
    sprite: _CE14/Structures/Walls/bricks_stone_wall.rsi
    state: frame
  - type: Construction
    graph: CE14WallStoneBrick
    node: CE14WallFrameStoneBrick
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14RockStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14StoneBlock1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CE14WallStonebrick
  name: stone brick wall
  parent: CE14BaseWall
  components:
  - type: Sprite
    sprite: _CE14/Structures/Walls/bricks_stone_wall.rsi
  - type: Icon
    sprite: _CE14/Structures/Walls/bricks_stone_wall.rsi
  - type: IconSmooth
    base: stonebricks
  - type: Construction
    graph: CE14WallStoneBrick
    node: CE14WallStoneBrick
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14RockStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14StoneBlock1:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: CE14WallFrameStoneBrick
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CE14WallpaperHolder

