- type: constructionGraph
  id: CE14Seat
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CE14ChairWooden
          steps:
            - material: CE14WoodenPlanks
              amount: 2
              doAfter: 2
        - to: CE14ChairWoodenBirch
          steps:
          - material: CE14BirchWoodenPlanks
            amount: 2
            doAfter: 2
    - node: CE14ChairWooden
      entity: CE14ChairWooden
      edges:
      - to: start
        steps:
        - tool: Prying
          doAfter: 2
        completed:
        - !type:SpawnPrototype
          prototype: CE14WoodenPlanks1
          amount: 2
    - node: CE14ChairWoodenBirch
      entity: CE14ChairWoodenBirch
      edges:
      - to: start
        steps:
        - tool: Prying
          doAfter: 2
        completed:
        - !type:SpawnPrototype
          prototype: CE14BirchWoodenPlanks1
          amount: 2

