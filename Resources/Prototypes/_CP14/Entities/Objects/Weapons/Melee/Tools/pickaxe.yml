- type: entity
  abstract: true
  id: CE14BaseWeaponPickaxe
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 1
    range: 1.6
    angle: 90
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 3
        Structural: 4
    animation: CE14WeaponArcSlash
    wideAnimation: CE14WeaponArcSlash
    soundHit:
      collection: MetalThud
    cPAnimationLength: 0.5
    cPAnimationOffset: 1
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 6
        Structural: 20
  - type: Wieldable
  - type: Clothing
    breakOnMove: false
    equipDelay: 1
    unequipDelay: 1
    slots:
    - neck
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: Prying
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg

- type: entity
  parent: CE14BaseWeaponPickaxe
  id: CE14WeaponPickaxeIron
  name: iron pickaxe
  description: A sturdy iron pickaxe, perfect for mining and not for combat.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Pickaxe/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 20
      CE14Iron: 20