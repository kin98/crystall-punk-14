- type: entity
  id: CE14ActionSpellFreeze
  parent: CE14ActionSpellBase
  name: Freeze
  description: You begin to severely cool down the target, slowing its movement speed.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.8
  - type: CE14ActionManaCost
    manaCost: 7
  - type: CE14ActionSpeaking
    startSpeech: "Vos adepto frigus..."
  - type: CE14ActionDoAfterVisuals
    proto: CE14RunePlantFreeze
  - type: CE14ActionDangerous
  - type: DoAfterArgs
    repeat: true
    breakOnDamage: true
    delay: 1.5
    distanceThreshold: 5
  - type: Action
    useDelay: 15
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: freeze
  - type: TargetAction
    range: 5
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectFreeze
      - !type:CE14AdjustAllSolutionThermalEnergy
        delta: -1200 # One full use cools 100u from ~300k to ~250k
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:MovespeedModifier
          walkSpeedModifier: 0.5
          sprintSpeedModifier: 0.5
          statusLifetime: 2
        - !type:AdjustTemperature
          amount: -12000
        - !type:ExtinguishReaction

- type: entity
  id: CE14ImpactEffectFreeze
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: circle_decrease
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14RunePlantFreeze
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5eabeb"
  - type: Sprite
    layers:
    - state: medium_circle
      color: "#5eabeb"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollFreeze
  name: freeze spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellFreeze
