- type: entity
  id: CE14BloodMoonRule
  parent: CE14BaseGameRule
  components:
  - type: CE14BloodMoonRule
    curseRule: CE14BloodMoonCurseRule
    announceSound:
       path: /Audio/_CE14/Announce/darkness_boom.ogg
  - type: GameRule
    delay:
      min:  30
      max:  60

- type: entity
  id: CE14BloodMoonCurseRule
  parent: CE14BaseGameRule
  components:
  - type: CE14BloodMoonCurseRule
    announcementColor: "#e32759"
  - type: AntagSelection
    definitions:
    - prefRoles: [ CE14BloodMoonCursed ]
      max: 15
      playerRatio: 2
      multiAntagSetting: NotExclusive
      lateJoinAdditional: true
      allowNonHumans: true
      mindRoles:
      - CE14MindRoleBloodMoonCursed
      briefing:
        text: CE14-roles-antag-blood-moon-cursed-briefing
        color: "#630f24"
        sound: "/Audio/_CE14/Announce/darkness_boom_2.ogg"

