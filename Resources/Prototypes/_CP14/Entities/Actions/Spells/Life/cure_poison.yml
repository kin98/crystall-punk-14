- type: entity
  id: CE14ActionSpellBloodPurification
  parent: CE14ActionSpellBase
  name: Blood purification
  description: You cleanse the target's blood of poisons and acids, and restore its volume slightly
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionSpeaking
    startSpeech: "Nella coda..."
    endSpeech: "sta il veleno"
  - type: CE14ActionTargetMobStatusRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneBloodPurification
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/healing.rsi
      state: cure_poison
  - type: TargetAction
    range: 7
    interactOnMiss: false
  - type: DoAfterArgs
    delay: 1.5
    breakOnDamage: true
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodPurification
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodPurification
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          damage:
            types:
              Poison: -10
              Bloodloss: -10
              Caustic: -10
        - !type:Jitter
        - !type:ModifyBloodLevel
          amount: 25

- type: entity
  id: CE14RuneBloodPurification
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#328643"
  - type: Sprite
    layers:
    - state: sun
      color: "#79b330"
      shader: unshaded
    - state: double_outer
      color: "#a1252f"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectBloodPurification
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#79b330"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollHealing
  id: CE14SpellScrollBloodPurification
  name: blood purification spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellBloodPurification
