- type: entity
  name: wood bench
  id: CE14BenchWood
  parent:
  - SeatBase
  - CE14BaseFlammable
  description: A bench carved from wood, a comfortable part of the interior designed for sitting and relaxing.
  categories: [ ForkFiltered ]
  components:
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Rotatable
  - type: Sprite
    sprite: _CE14/Structures/Furniture/bench.rsi
    layers:
    - state: wooden
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
  - type: Construction
    graph: CE14BenchWood
    node: CE14BenchWood

- type: entity
  id: CE14BenchWoodBirch
  parent: CE14BenchWood
  components:
  - type: Sprite
    sprite: _CE14/Structures/Furniture/bench.rsi
    layers:
    - state: birch
  - type: Construction
    graph: CE14BenchWood
    node: CE14BenchWoodBirch
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14BirchWoodenPlanks1:
            min: 1
            max: 2
