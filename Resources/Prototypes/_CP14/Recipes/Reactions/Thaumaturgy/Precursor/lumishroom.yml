
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14LumiMushroomSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14LumiMushroom:
      amount: 1
  products:
    CE14EssenceLight: 0.5
    CE14EssenceEarth: 0.5

