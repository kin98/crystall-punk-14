- type: entity
  abstract: true
  parent: Clothing
  id: CE14ClothingMaskBase
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Clothing
    equipDelay: 0.7
    unequipDelay: 0.4
    slots: [mask]

- type: entity
  parent: CE14ClothingMaskBase
  id: CE14ClothingMaskSinner
  name: sinner's mask
  description: A mask intented to be worn by not the brightest individuals. Executioners put them on themselves and the victim before execution.
  components:
  - type: Sprite
    sprite: _CE14/Clothing/Masks/sinner.rsi
  - type: Clothing
    sprite: _CE14/Clothing/Masks/sinner.rsi
  - type: IdentityBlocker
  - type: IngestionBlocker

- type: entity
  parent: CE14ClothingMaskBase
  id: CE14ClothingMaskSteelMask
  name: steel mask
  description: A steel mask that protects the face from the external effects of iron.
  components:
  - type: Sprite
    sprite: _CE14/Clothing/Masks/steel_mask.rsi
  - type: Clothing
    sprite: _CE14/Clothing/Masks/steel_mask.rsi
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: PhysicalComposition
    materialComposition:
      CE14Iron: 20

- type: entity
  parent: CE14ClothingMaskBase
  id: CE14ClothingMaskNeckerchief
  name: neckerchief
  description: It hides your face to the best of its ability.
