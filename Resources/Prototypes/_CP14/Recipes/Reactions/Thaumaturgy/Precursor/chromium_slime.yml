
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14ChromiumSlimeSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14ChromiumSlime:
      amount: 1
  products:
    CE14EssenceCycle: 1


# Chromium slime is a special reagent that inverts solution properties.

- type: reaction
  id: CE14ChromiumInverseEffect
  quantized: true
  minTemp: 350
  conserveEnergy: false
  reactants:
    CE14ChromiumSlime:
      amount: 1
  products:
    CE14SideEffectEmpty: 1
  effects:
  - !type:CE14InverseEffect
    inversion:
      CE14HealingEffectHealBrute: CE14DamageEffectDamageBrute
      CE14DamageEffectDamageBrute: CE14HealingEffectHealBrute
      #
      CE14HealingEffectHealPoison: CE14DamageEffectDamagePoison
      CE14DamageEffectDamagePoison: CE14HealingEffectHealPoison
      #
      CE14DamageEffectDamageHeat: CE14HealingEffectHealHeat
      CE14HealingEffectHealHeat: CE14DamageEffectDamageHeat
      #
      CE14DamageEffectDamageCold: CE14HealingEffectHealCold
      CE14HealingEffectHealCold: CE14DamageEffectDamageCold
      #
      CE14PositiveEffectSatiateHunger: CE14SideEffectVomit
      CE14PositiveEffectSatiateThirst: CE14PositiveEffectSatiateHunger
      CE14SideEffectVomit: CE14PositiveEffectSatiateThirst
      #
      CE14NegativeEffectDamageMana: CE14PositiveEffectHealMana
      CE14PositiveEffectHealMana: CE14NegativeEffectDamageMana
      #
      CE14DamageEffectBloodAbsorption: CE14HealingEffectBloodRestore
      CE14HealingEffectBloodRestore: CE14DamageEffectBloodAbsorption
      #
      CE14NegativeEffectSpeedDown: CE14PositiveEffectSpeedUp
      CE14PositiveEffectSpeedUp: CE14NegativeEffectSpeedDown
      #
      CE14DamageEffectDamageAirloss: CE14HealingEffectHealAirloss
      CE14HealingEffectHealAirloss: CE14DamageEffectDamageAirloss
      #
      CE14PositiveEffectUnsleep: CE14NegativeEffectSleep
      CE14NegativeEffectSleep: CE14PositiveEffectUnsleep
      #
      CE14SideEffectRainbow: CE14SideEffectEmoteCough
      CE14SideEffectEmoteCough: CE14SideEffectRainbow
      #
      CE14PositiveEffectHealStam: CE14NegativeEffectDamageStam
      CE14NegativeEffectDamageStam: CE14PositiveEffectHealStam
