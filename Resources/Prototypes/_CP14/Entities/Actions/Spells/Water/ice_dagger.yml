- type: entity
  id: CE14ActionSpellIceDagger
  parent: CE14ActionSpellBase
  name: Ice dagger
  description: You form an icy sharp dagger that will do for temporary use.
  components:
  - type: CE14ActionManaCost
    manaCost: 25
  - type: CE14ActionSpeaking
    startSpeech: "Un pittore sulla..."
    endSpeech: "soglia della mano"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneWaterCreation
  - type: DoAfterArgs
    delay: 0.5
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: ice_dagger
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectWaterCreation
      - !type:CE14SpellSpawnInHandEntity
        spawns:
        - CE14WeaponDaggerIce

- type: entity
  name: ice dagger
  parent: CE14BaseWeaponDagger
  id: CE14WeaponDaggerIce
  description: A sharp ice dagger, not very durable but can temporarily replace real weapons.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Dagger/ice.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 3
        Piercing: 3
        Cold: 4
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 3
        Piercing: 3
        Cold: 4
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TimedDespawn
    lifetime: 60

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollIceDagger
  name: ice dagger spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellIceDagger

