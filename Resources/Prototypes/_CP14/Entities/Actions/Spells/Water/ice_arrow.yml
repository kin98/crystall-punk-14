- type: entity
  id: CE14ActionSpellIceArrow
  parent: CE14ActionSpellBase
  name: Ice arrow
  description: You create a temporary sharp ice arrow that can be used as a disposable bow projectile.
  components:
  - type: CE14ActionManaCost
    manaCost: 7
  - type: CE14ActionSpeaking
    startSpeech: "Sagitta glaciei..."
    endSpeech: "in manu mea"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneWaterCreation
  - type: DoAfterArgs
    delay: 0.5
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: ice_arrow
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectWaterCreation
      - !type:CE14SpellSpawnInHandEntity
        spawns:
        - CE14IceArrow

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollIceArrow
  name: ice arrow spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellIceArrow

- type: entity
  id: CE14IceArrow
  parent: CE14ArrowBase
  name: ice arrow
  description: A sharp ice arrow created with magic. It melts and will soon disappear, but you can shoot it once with your bow.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Ranged/Projectiles/ice_arrow.rsi
    layers: 
    - state: icon
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Projectile
    damage:
      types:
        Piercing: 15
        Cold: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TimedDespawn
    lifetime: 240