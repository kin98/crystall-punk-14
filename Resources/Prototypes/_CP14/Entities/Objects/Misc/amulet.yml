# TODO remove amulets from the game and replace with something not-wearable visually

- type: entity
  abstract: true
  parent: BaseItem
  id: CE14ClothingJewelleryBase
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Small

- type: entity
  parent: CE14ClothingJewelleryBase
  id: CE14ClothingCloakAmuletGold
  name: gold amulet
  description: A gold amulet, a valuable trinket.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Misc/Amulet/amulet.rsi
    layers:
    - state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14Gold: 5
  - type: StaticPrice
    price: 20

- type: entity
  parent: CE14ClothingJewelleryBase
  id: CE14ClothingCloakAmuletMana
  name: strange amulet
  description: A gold amulet with a magical stone inside.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Misc/Amulet/amulet_mana.rsi
    layers:
    - state: icon
    - state: amethyst_stone
  - type: PhysicalComposition
    materialComposition:
      CE14Gold: 5
  - type: StaticPrice
    price: 30
