- type: entity
  id: CE14FoodDoughLarge
  parent: FoodInjectableBase
  name: large piece of dough
  description: The perfect ingredient for any flour product. The only thing left to do is to shape it.
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Normal
  - type: Temperature
  - type: FlavorProfile
    flavors:
      - bread #TODO smth disguisting. raw dough
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: dough_large
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: UncookedAnimalProteins
          Quantity: 2
  - type: SliceableFood
    count: 4
    slice: CE14FoodDoughMedium
  - type: CE14TemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14FoodBread
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodBread
  parent: CE14FoodDoughLarge
  name: bread
  description: Crispy and so flavourful!
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: bread_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Protein
          Quantity: 2
  - type: SliceableFood
    count: 4
    slice: CE14FoodBreadSlice
  - type: CE14TemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14Ash1
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodBreadSlice
  parent: CE14FoodDoughMedium
  name: bread slice
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: bread_slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7 # 1/4 bread
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 0.5
  - type: CE14TemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: null
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodDoughMedium
  parent: FoodInjectableBase
  name: medium piece of dough
  categories: [ ForkFiltered ]
  components:
  - type: Item
    size: Tiny
  - type: Temperature
  - type: FlavorProfile
    flavors:
      - bread #TODO smth disguisting. raw dough
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: dough_medium
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7 # 1/4 large dough
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: UncookedAnimalProteins
          Quantity: 0.5
  - type: CE14TemperatureTransformation
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14FoodBreadBun
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodBreadBun
  parent: CE14FoodDoughMedium
  name: bread bun
  description: it's like regular bread, only smaller and funnier.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: bun_cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6 # 1/4 large dough
        reagents:
        - ReagentId: Nutriment
          Quantity: 5.2
        - ReagentId: Protein
          Quantity: 0.5
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: CE14FoodBreadBunBottom
        amount: 1
      - id: CE14FoodBreadBunTop
        amount: 1
  - type: CE14TemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14Ash1
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodBreadBunBottom
  parent: CE14FoodDoughMedium
  name: botton bread bun
  description: It's like regular bread, only smaller and funnier. And cut in half.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    layers:
    - state: bun_cooked_slice_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: CE14Sandwich
    maxLayers: 5
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: CE14-food-sequence-sandwich-gen
    contentSeparator: ", "
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4 # 1/2 bun
        canReact: false
        reagents:
        - ReagentId: Nutriment
          Quantity: 2.6
        - ReagentId: Protein
          Quantity: 0.25
  - type: CE14TemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14Ash1
  - type: Tag
    tags:
    - CE14Dough

- type: entity
  id: CE14FoodBreadBunTop
  parent: CE14FoodDoughMedium
  name: top bread bun
  description: It's like regular bread, only smaller and funnier. And cut in half.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/dough.rsi
    state: bun_cooked_slice_top
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 4 # 1/2 bun
        reagents:
        - ReagentId: Nutriment
          Quantity: 2.6
        - ReagentId: Protein
          Quantity: 0.25
  - type: FoodSequenceElement
    entries:
      CE14Sandwich: CE14BunTopSandwich
  - type: CE14TemperatureTransformation
    autoTransformOnCooked: false
    entries:
    - temperatureRange: 400, 500
      transformTo: CE14Ash1
  - type: Tag
    tags:
    - CE14Dough

