- type: entity
  id: CE14ActionSpellMagicBallade
  parent: CE14ActionSpellBase
  name: Magic ballade
  description: With your music, you infuse the objects around you with mana
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.8
  - type: CE14ActionManaCost
    manaCost: 5
    canModifyManacost: false
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 1
  - type: CE14ActionRequiredMusicTool
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneMagicBallade
  - type: Action
    sound: null
    useDelay: 15
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: magic_music
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellArea
        range: 5
        maxTargets: 5
        whitelist:
          components:
          - CE14MagicEnergyContainer
          - CE14MagicEnergyCrystalSlot
        effects:
        - !type:CE14SpellSpawnEntityOnTarget
          spawns:
          - CE14ImpactEffectMagicBallade
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:CE14ManaChange
            manaDelta: 1.2
            safe: true

- type: entity
  id: CE14ImpactEffectMagicBallade
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_5
      color: "#5096d4"
      shader: unshaded

- type: entity
  id: CE14RuneMagicBallade
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5096d4"
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_3
      color: "#5096d4"
      shader: unshaded

