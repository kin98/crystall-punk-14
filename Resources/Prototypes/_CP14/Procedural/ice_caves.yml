- type: biomeTemplate
  id: CE14IceCavesFloor
  layers:
    - !type:BiomeMetaLayer
      template: CE14Snowland
    - !type:BiomeTileLayer
      tile: CE14FloorIce
      threshold: 0.0
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1
    #Entity
    - !type:BiomeEntityLayer
      threshold: 0.4
      noise:
        seed: 1
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorSnowDeepDeep
      entities:
        - CE14Snowdrift

- type: biomeTemplate
  id: CE14IceCavesGeneric
  layers:
    - !type:BiomeMetaLayer
      template: CE14IceCavesFloor
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.5
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14WallSnow
    - !type:BiomeEntityLayer
      threshold: -0.2
      invert: true
      noise:
        seed: 156
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CE14FloorSnow
        - CE14FloorSnowDeep
        - CE14FloorSnowDeepDeep
      entities:
        - CE14WallStone
    - !type:BiomeEntityLayer
      threshold: -0.5
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - CE14FloorIce
      entities:
        - CE14WindowIceBlock

