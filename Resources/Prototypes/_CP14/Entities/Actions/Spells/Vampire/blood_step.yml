- type: entity
  id: CE14ActionSpellVampireBloodStep
  parent: CE14ActionSpellBase
  name: Blood step
  description: A step through the gash of reality that allows you to cover a small of distance quickly
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.4
  - type: CE14MagicEffectVampire
  - type: CE14ActionManaCost
    manaCost: 30
  - type: CE14ActionDoAfterVisuals
    proto: CE14ImpactEffectBloodStep
  - type: DoAfterArgs
    delay: 0.5
    hidden: true
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: blood_step
  - type: TargetAction
    checkCanAccess: true
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodStep
      effects:
      - !type:CE14SpellCasterTeleport
        needVision: true

- type: entity
  id: CE14ImpactEffectBloodStep
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: wave_up
      color: red
      unshaded: true
  - type: LightFade
    duration: 1.5
  - type: PointLight
    color: "#d60032"
    radius: 4.0
    energy: 3.0
