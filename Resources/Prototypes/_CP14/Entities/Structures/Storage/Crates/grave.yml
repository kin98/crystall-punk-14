- type: entity
  parent: CrateGeneric
  id: CE14CrateDirtPitGrave
  categories: [ ForkFiltered ]
  name: dirt pit
  description: "There's something buried here... or someone..."
  components:
  - type: Sprite
    noRot: false
    snapCardinals: true
    sprite: _CE14/Structures/Storage/dirt_pit.rsi
    layers:
    - state: base
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 # discourage just beating the grave to break it open
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: CE14Digging
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14DirtBlock1:
            min: 2
            max: 3
  - type: Fixtures
    fixtures:
      rune:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
          - ItemMask
        layer:
          - SlipLayer
  - type: Physics
    bodyType: Static
  - type: Grave
  - type: EntityStorage
    airtight: true
    isCollidableWhenOpen: false
    closeSound:
      collection: CE14Digging
    openSound:
      collection: CE14Digging
  - type: Construction
    graph: CE14CrateDirtPitGrave
    node: CE14CrateDirtPitGrave

- type: entity
  parent: CE14CrateDirtPitGrave
  id: CE14CrateDirtPitGraveFilled
  suffix: Random filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: CE14TombstoneTable
        rolls: !type:ConstantNumberSelector
          value: 4

- type: entityTable
  id: CE14TombstoneTable
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Body parts
      children:
      - id: CE14TorsoZombie
      - id: CE14LeftArmZombie
      - id: CE14LeftFootZombie
      - id: CE14LeftHandZombie
      - id: CE14LeftLegZombie
      - id: CE14RightArmZombie
      - id: CE14RightFootZombie
      - id: CE14RightHandZombie
      - id: CE14RightLegZombie
      - id: CE14HeadZombie
        weight: 2
      - id: CE14TorsoSkeleton
      - id: CE14LeftArmSkeleton
      - id: CE14LeftFootSkeleton
      - id: CE14LeftHandSkeleton
      - id: CE14LeftLegSkeleton
      - id: CE14RightArmSkeleton
      - id: CE14RightFootSkeleton
      - id: CE14RightHandSkeleton
      - id: CE14RightLegSkeleton
      - id: CE14HeadSkeleton
        weight: 2
    - !type:GroupSelector # Rarities
      weight: 0.2
      children:
      - !type:NestedSelector
        tableId: CE14StationCrateLoot

