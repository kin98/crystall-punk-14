- type: entity
  parent: CE14BaseGameRule
  id: CE14BaseStationEventShortDelay
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  parent: CE14BaseGameRule
  id: CE14BaseStationEventLongDelay
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  40
      max:  60

- type: entityTable
  id: CE14BasicCalmEventsTable
  table: !type:AllSelector
    children:
    - id: CE14Storm

- type: entity
  parent: CE14BaseStationEventLongDelay
  id: CE14Storm
  components:
  - type: StationEvent
    startAnnouncement: CE14-event-announcement-storm
    startAudio:
      collection: CE14LightningFar
    earliestStart: 45
    minimumPlayers: 10
    duration: 180
    maxDuration: 600
  - type: CE14WeatherRule
    weather: CE14Storm

