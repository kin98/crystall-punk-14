- type: entity
  id: CE14ActionSpiderTrap
  name: web trap
  description: You wrap a web around the target, slowing its movement.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.3
  - type: Action
    itemIconStyle: BigAction
    useDelay: 20
    sound: !type:SoundPathSpecifier
      path: /Audio/Animals/snake_hiss.ogg
    icon:
      sprite: _CE14/Structures/Dungeon/floor_web.rsi
      state: full
  - type: DoAfterArgs
    breakOnMove: false
    breakOnDamage: false
    hidden: true
    delay: 0.5
  - type: TargetAction
    range: 10
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactSpiderTrap
      effects:
      - !type:CE14SpellSpawnEntitiesOnTargetInRadius
        spawn: CE14SpiderWeb
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactSpiderTrap

- type: entity
  id: CE14ImpactSpiderTrap
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: circle_increase
    - sprite: _CE14/Effects/Magic/area_impact.rsi
      state: area_impact_out