- type: entity
  id: CE14Torch
  parent:
  - BaseItem
  - CE14BaseTorch
  name: torch
  description: At its core, a stick burning on one side. Used to light up the area.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE14/Objects/Tools/torch.rsi
    layers:
      - state: torch-unlit
        map: ["fuel"]
  - type: Item
    size: Normal
    shape:
    - 0,0,0,2
    storedRotation: -65
  - type: FireVisuals
    sprite: _CE14/Objects/Tools/torch.rsi
    normalState: lit-overlay
  - type: ToggleableLightVisuals
    spriteLayer: null
    inhandVisuals:
      left:
      - state: lit-inhand-left
        shader: unshaded
      right:
      - state: lit-inhand-right
        shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.FireplaceFuelVisuals.Status:
        fuel:
          Empty: { state: torch-spent }
          Medium: { state: torch-unlit }
          Full: { state: torch-unlit }
  - type: CE14DelayedIgnitionSource
  - type: CE14IgnitionModifier
    hideCaution: true
  - type: Construction
    graph: CE14Torch
    node: CE14torch
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: 240
    wideAnimation: CE14WeaponArcSlash
    damage:
      types:
        Blunt: 4
  - type: CE14FlammableBonusDamage
  - type: UseDelay
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: Tag
    tags:
    - CE14Torch
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 10
      CE14Cloth: 10

- type: entity
  parent: CE14Torch
  id: CE14TorchIgnited
  suffix: Ignited
  components:
  - type: CE14AutoIgnite
