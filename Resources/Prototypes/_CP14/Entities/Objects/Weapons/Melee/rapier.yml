- type: entity
  abstract: true
  id: CE14BaseWeaponRapier
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  components:
  - type: Item
    size: Ginormous
  - type: MeleeWeapon
    attackRate: 1.5
    range: 1.2
    angle: 20 
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 10
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.3
    cPAnimationOffset: 1
  - type: Clothing
    slots:
    - belt
    breakOnMove: false
    equipDelay: 0.5
    unequipDelay: 0.5

- type: entity
  parent: CE14BaseWeaponRapier
  id: CE14WeaponRapierIron
  name: rapier
  description: An elegant and finely balanced blade, favored by Zellasian officers for its reach and precision. Its craftsmanship reflects imperial tradition and deadly efficiency.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Rapier/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 10
      CE14Iron: 10