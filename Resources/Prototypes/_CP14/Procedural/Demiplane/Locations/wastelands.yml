- type: CE14Location
  id: T1Wastelands
  name: CE14-demiplane-location-wastelands
  icon:
    sprite: _CE14/Interface/Misc/demiplane_locations.rsi
    state: wastelands
  levels:
    min: 3
    max: 10
  locationConfig: CE14WastelandsIsland
  tags:
  - CE14DemiplaneOres
  - CE14DemiplaneOpenSky
  components:
  - type: MapLight
    ambientLightColor: "#BFEEFFFF"
  - type: CE14CloudShadows
  - type: Biome
    template: CE14ChasmFill
  - type: SunShadow
  - type: SunShadowCycle
  - type: Roof

- type: dungeonConfig
  id: CE14WastelandsIsland
  layers:
  # Masks
  - !type:NoiseDistanceDunGen
    size: 120, 120
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.7
    layers:
    - tile: CE14FloorSand
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  - !type:NoiseDistanceDunGen
    size: 115, 115
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.6
    layers:
    - tile: CE14FloorGrass
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  - !type:NoiseDistanceDunGen
    size: 90, 90
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.5
    layers:
    - tile: CE14FloorBase
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5
  # Biomes
  - !type:BiomeDunGen
    biomeTemplate: CE14CavesGeneric
    tileMask:
    - CE14FloorBase
  - !type:BiomeDunGen
    biomeTemplate: CE14Wastelands
    tileMask:
    - CE14FloorGrass
  - !type:BiomeDunGen
    biomeTemplate: CE14Wastelands
    tileMask:
    - CE14FloorSand
