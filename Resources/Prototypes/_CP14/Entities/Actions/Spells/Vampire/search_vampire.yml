- type: entity
  id: CE14ActionSpellBloodConnection
  parent: CE14ActionSpellBase
  name: Blood connection
  description: You can sense the location of vampires from your clan from miles away.
  components:
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneVampireHypnosis
  - type: DoAfterArgs
    delay: 1.5
  - type: Action
    useDelay: 8
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: search_clan
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectVampireHypnosis
      - !type:CE14SpellPointerToVampireClan
        searchRange: 60
        pointerEntity: CE14BloodlustPointer

- type: entity
  parent: CE14ActionSpellBloodConnection
  id: CE14ActionSpellBloodEnemySearch
  name: Blood identification
  description: You are searching within a large radius for all vampires from other factions and their clan hearts.
  components:
  - type: Action
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: search_clan_enemy
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
       effects:
       - !type:CE14SpellSpawnEntityOnTarget
         spawns:
         - CE14ImpactEffectVampireHypnosis
       - !type:CE14SpellPointerToVampireClan
         inversed: true
         searchRange: 60
         pointerEntity: CE14BloodlustPointer

- type: entity
  id: CE14BloodlustPointer
  name: pointer
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      color: red
      sprite: /Textures/_CE14/Effects/Magic/pointer.rsi
      offset: 0, -1
      layers:
        - state: pointer
          shader: unshaded
      drawdepth: LowFloors
    - type: PointLight
      netSync: false
      radius: 3
      color: red
      energy: 0.2
    - type: TimedDespawn
      lifetime: 8
    - type: Tag
      tags:
      - HideContextMenu