- type: entity
  id: CE14ActionSpellSearchOfLife
  parent: CE14ActionSpellBase
  name: Search of life
  description: Detects all living things in a large radius around you.
  components:
  - type: CE14ActionManaCost
    manaCost: 30
  - type: CE14ActionSpeaking
    startSpeech: "Ego vultus..."
    endSpeech: "parumper vita"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneSearchOfLife
  - type: DoAfterArgs
    delay: 1.5
    breakOnDamage: true
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/light.rsi
      state: search_of_life
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectSearchOfLife
      - !type:CE14SpellPointerToAlive
        pointerEntity: CE14SearchOfLifePointer
        searchRange: 30

- type: entity
  id: CE14ImpactEffectSearchOfLife
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#efedff"
      shader: unshaded
    - state: circle_increase
      color: "#79b330"
      shader: unshaded

- type: entity
  id: CE14RuneSearchOfLife
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#328643"
  - type: Sprite
    layers:
    - state: sun
      color: "#efedff"
      shader: unshaded
    - state: double_outer
      color: "#79b330"
      shader: unshaded

- type: entity
  id: CE14SearchOfLifePointer
  name: pointer
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: /Textures/_CE14/Effects/Magic/pointer.rsi
      offset: 0, -1
      layers:
        - state: pointer
          shader: unshaded
      drawdepth: LowFloors
    - type: PointLight
      netSync: false
      radius: 3
      color: "#ffffff"
      energy: 0.2
    - type: TimedDespawn
      lifetime: 8
    - type: Tag
      tags:
      - HideContextMenu

- type: entity
  parent: CE14BaseSpellScrollLight
  id: CE14SpellScrollSearchOfLife
  name: search of life spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellSearchOfLife
