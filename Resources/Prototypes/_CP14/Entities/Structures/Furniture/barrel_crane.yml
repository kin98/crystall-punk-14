- type: entity
  id: CE14CraneBarrel
  parent: [BaseStructure, CE14BarrelSolution, CE14BaseFlammable]
  name: wooden crane barrel
  description: Large lying barrel with tap, for storing valuable liquids.
  suffix: Empty
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _CE14/Structures/Furniture/Barrels/crane_barrel.rsi
    layers:
      - state: barrel
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Physics
    bodyType: Static
  - type: Transform
  - type: Anchorable
    delay: 3
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: barrel
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpillBehavior
        solution: barrel
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: SolutionContainerManager
    solutions:
      barrel:
        maxVol: 500
  - type: Construction
    graph: CE14CraneBarrel
    node: CE14CraneBarrel
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 50

- type: entity
  parent: CE14CraneBarrel
  id: CE14CraneBarrelDwarfBeer
  suffix: Beer. Dwarf
  categories: [ ForkFiltered ]
  components:
  - type: SolutionContainerManager
    solutions:
      barrel:
        reagents:
        - ReagentId: CE14DwarfBeer
          Quantity: 500
  - type: Label
    currentLabel: CE14-reagent-name-dwarfbeer

