- type: entity
  id: CE14ActionSpellHeat
  parent: CE14ActionSpellBase
  name: Heat
  description: You start to heat the target up a lot, burning it from the inside.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.8
  - type: CE14ActionManaCost
    manaCost: 7
  - type: CE14ActionSpeaking
    startSpeech: "Vos adepto calidum..."
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneHeat
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 4
    icon:
      sprite: _CE14/Actions/Spells/fire.rsi
      state: heat
  - type: DoAfterArgs
    hidden: true
    repeat: true
    distanceThreshold: 5
  - type: TargetAction
    range: 8
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectHeat
      - !type:CE14AdjustAllSolutionThermalEnergy
        delta: 2500
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:AdjustTemperature
          amount: 20000
        - !type:ExtinguishReaction

- type: entity
  id: CE14ImpactEffectHeat
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: circle_increase
      color: "#eea911"
      shader: unshaded

- type: entity
  id: CE14RuneHeat
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    layers:
    - state: sun
      color: "#eea911"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollFire
  id: CE14SpellScrollHeat
  name: heat spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellHeat
