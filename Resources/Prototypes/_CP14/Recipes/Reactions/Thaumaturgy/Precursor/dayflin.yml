
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14DayflinSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14YellowDayflinPulp:
      amount: 1
  products:
    CE14EssenceFire: 0.5
    CE14EssenceMotion: 0.5

# Admixture: By adding raw precursor to a potion with target solutions, we can reduce the amount of empty solution by modifying the target solutions.

- type: reaction
  id: CE14DayflinAdmixture1
  minTemp: 500
  reactants:
    CE14YellowDayflinPulp:
      amount: 1
    CE14SideEffectEmpty:
      amount: 1
    CE14PositiveEffectSatiateThirst:
      amount: 1
  products:
    CE14PositiveEffectSpeedUp: 2
    CE14SideEffectJitter: 1

