- type: entity
  id: CE14BaseCrate
  abstract: true
  parent: BaseStructureDynamic
  categories: [ ForkFiltered ]
  components:
  - type: InteractionOutline
  - type: Climbable
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ base ]
        state: icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: open }
          False: { state: icon }
  - type: Storage
    grid:
    - 0,0,7,7
    maxItemSize: Large
    storageOpenSound: /Audio/Effects/closetopen.ogg
    storageCloseSound: /Audio/Effects/closetclose.ogg
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 525
        mask:
        - SmallMobMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer

- type: entity
  id: CE14BaseSmallCrate
  abstract: true
  parent: CE14BaseCrate
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 300
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Storage
    grid:
    - 0,0,5,5
    maxItemSize: Normal

- type: entity
  id: CE14LargeWoodenCrate
  name: large wooden crate
  description: Solid wooden crate.
  parent:
  - CE14BaseCrate
  - CE14BaseFlammable
  components:
  - type: Sprite
    sprite: _CE14/Structures/Storage/Crates/large_wooden_crate.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14LargeWoodenCrate
    node: CE14LargeWoodenCrate

- type: entity
  id: CE14SmallWoodenCrate
  name: small wooden crate
  description: Solid wooden crate.
  parent:
  - CE14BaseSmallCrate
  - CE14BaseFlammable
  components:
  - type: Sprite
    sprite: _CE14/Structures/Storage/Crates/small_wooden_crate.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CE14Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14SmallWoodenCrate
    node: CE14SmallWoodenCrate
