  name: CE14-reagent-name-basic-damage-mana
  desc: CE14-reagent-desc-basic-damage-mana
  group: CE14NegativeEffect
  flavor: CE14Bitterly
  color: "#6014e3"
  physicalDesc: CE14-reagent-physical-desc-iridescent
