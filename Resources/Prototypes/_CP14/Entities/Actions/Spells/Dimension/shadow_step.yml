- type: entity
  id: CE14ActionSpellShadowStep
  parent: CE14ActionSpellBase
  name: Shadow step
  description: A step through the gash of reality that allows you to cover a small of distance quickly
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.8
  - type: CE14ActionManaCost
    manaCost: 20
  - type: CE14ActionDoAfterVisuals
    proto: CE14ImpactEffectShadowStep
  - type: CE14ActionFreeHandsRequired
  - type: Action
    useDelay: 30
    icon:
      sprite: _CE14/Actions/Spells/dimension.rsi
      state: shadow_step
  - type: DoAfterArgs
    breakOnHandChange: false
    breakOnMove: false
    hidden: true
    delay: 0.5
  - type: TargetAction
    range: 7
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectShadowStep
      effects:
      - !type:CE14SpellCasterTeleport

- type: entity
  id: CE14ImpactEffectShadowStep
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: wave_up
      color: "#5e427e"

- type: entity
  parent: CE14BaseSpellScrollDimension
  id: CE14SpellScrollShadowStep
  name: shadow step spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellShadowStep
