# Wooden

- type: entity
  id: CE14WallFrameWooden
  name: wooden wall frame
  parent:
  - CE14BaseWallFrame
  - CE14BaseFlammableSpreading
  components:
  - type: Sprite
    sprite: _CE14/Structures/Walls/wooden_wall.rsi
    state: frame
  - type: Icon
    sprite: _CE14/Structures/Walls/wooden_wall.rsi
    state: frame
  - type: Construction
    graph: CE14WallWooden
    node: CE14WallFrameWooden
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14WoodStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: CE14WallWooden
  name: wooden wall
  parent:
  - CE14BaseWall
  - CE14BaseFlammableSpreading
  components:
  - type: Sprite
    sprite: _CE14/Structures/Walls/wooden_wall.rsi
  - type: Icon
    sprite: _CE14/Structures/Walls/wooden_wall.rsi
  - type: IconSmooth
    base: wood
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14WoodStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14WoodenPlanks1:
            min: 1
            max: 2
      - !type:ChangeConstructionNodeBehavior
        node: CE14WallFrameWooden
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14WallWooden
    node: CE14WallWooden
  - type: CE14WallpaperHolder

