- type: entity
  id: CE14ActionSpellBeerCreation
  parent: CE14ActionSpellBase
  name: Beer creation
  description: A secret spell that materializes beer from pure mana.
  components:
  - type: Sprite
    sprite: _CE14/Actions/Spells/water.rsi
    state: beer_creation
  - type: CE14ActionManaCost
    manaCost: 20
  - type: CE14ActionSpeaking
    startSpeech: "beer..."
    endSpeech: "Arriva la birra"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneBeerCreation
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: beer_creation
  - type: DoAfterArgs
    delay: 1
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBeerCreation
      - !type:CE14SpellSpawnInHandEntity
        spawns:
        - CE14LiquidDropBeer

- type: entity
  id: CE14RuneBeerCreation
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5eabeb"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#9e522c"
      shader: unshaded
    - state: medium_circle
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14LiquidDropBeer
  parent: CE14LiquidDropWater
  categories: [ ForkFiltered ]
  suffix: Beer
  components:
  - type: SolutionContainerManager
    solutions:
      drop:
        maxVol: 10
        reagents:
        - ReagentId: CE14MagicBeer
          Quantity: 10

- type: entity
  id: CE14ImpactEffectBeerCreation
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5eabeb"
      shader: unshaded
    - state: particles_down
      color: "#9e522c"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollBeerCreation
  name: beer creation spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellBeerCreation