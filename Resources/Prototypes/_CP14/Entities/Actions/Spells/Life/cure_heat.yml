- type: entity
  id: CE14ActionSpellCureBurn
  parent: CE14ActionSpellBase
  name: Cure burn
  description: You heal skin damage caused by excessive cooling or heating.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionTargetMobStatusRequired
  - type: CE14ActionSpeaking
    startSpeech: "Pellis dolorem..."
    endSpeech: "non novit"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneCureBurn
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/healing.rsi
      state: cure_burn
  - type: DoAfterArgs
    delay: 1.5
    breakOnDamage: true
  - type: TargetAction
    range: 7
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectCureBurn
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectCureBurn
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          damage:
            types:
              Cold: -10
              Heat: -10
              Shock: -10
        - !type:Jitter

- type: entity
  id: CE14RuneCureBurn
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#328643"
  - type: Sprite
    layers:
    - state: sun
      color: "#79b330"
      shader: unshaded
    - state: double_outer
      color: "#ed9b4a"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectCureBurn
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#79b330"
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollHealing
  id: CE14SpellScrollCureBurn
  name: cure burn spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellCureBurn
