
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14BloodFlowerSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BloodFlowerSap:
      amount: 1
  products:
    CE14EssenceLife: 0.5
    CE14EssenceWater: 0.5

- type: reaction
  id: CE14BloodFlowerBloodSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BloodFlowerSap:
      amount: 1
    CE14BloodTiefling:
      amount: 1
  products:
    CE14EssenceFire: 1
    CE14EssenceLife: 1

- type: reaction
  id: CE14BloodFlowerTieflingSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BloodFlowerSap:
      amount: 1
    CE14Blood:
      amount: 1
  products:
    CE14EssenceLife: 2

- type: reaction
  id: CE14BloodFlowerElfSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BloodFlowerSap:
      amount: 1
    CE14BloodElf:
      amount: 1
  products:
    CE14EssenceOrder: 1
    CE14EssenceLife: 1

- type: reaction
  id: CE14BloodFlowerGoblinSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14BloodFlowerSap:
      amount: 1
    CE14BloodGoblin:
      amount: 1
  products:
    CE14EssenceChaos: 1
    CE14EssenceLife: 1

