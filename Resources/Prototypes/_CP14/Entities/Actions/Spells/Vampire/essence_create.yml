- type: entity
  id: CE14ActionSpellBloodEssenceCreation
  parent: CE14ActionSpellBase
  name: Form the essence of blood
  description: You extract the essence of life stolen from other beings from your body to pass on to other vampires or use in rituals.
  components:
  - type: CE14ActionManaCost
    manaCost: 15
  - type: CE14ActionSkillPointCost
    skillPoint: Blood
    count: 1
  - type: DoAfterArgs
    delay: 2.5
  - type: Action
    useDelay: 1
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: essence_create
    sound: !type:SoundPathSpecifier
      path: /Audio/_CE14/Effects/essence_consume.ogg
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:Jitter
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodEssence
      - !type:CE14SpellSpawnInHandEntity
        spawns:
        - CE14BloodEssence