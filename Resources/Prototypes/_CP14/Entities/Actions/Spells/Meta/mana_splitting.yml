- type: entity
  id: CE14ActionSpellMagicSplitting
  parent: CE14ActionSpellBase
  name: Magic splitting
  description: You destroy the very essence of magic, interrupting spell casts, destroying mana and more.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.7
  - type: CE14ActionManaCost
    manaCost: 10
  - type: DoAfterArgs
    delay: 1
    repeat: true
    breakOnMove: true
    breakOnDamage: true
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneMagicSplitting
  - type: Action
    useDelay: 15
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: counter_spell
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    whitelist:
      components:
      - CE14MagicEnergyContainer
      - ExaminableSolution
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellMixSolution
        reactionTypes:
        - CE14MagicSplitting
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectMagicSplitting
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:CE14ManaChange
          manaDelta: -5
          safe: false

- type: entity
  id: CE14RuneMagicSplitting
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#601fc2"
  - type: Sprite
    layers:
    - state: medium_circle
      color: "#601fc2"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectMagicSplitting
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: Effects/electricity.rsi
    layers:
    - state: electrified
      color: "#601fc2"
      shader: unshaded
  - type: PointLight
    color: "#601fc2"
    enabled: true
    radius: 2
    energy: 2
    netsync: false
  - type: LightFade
    duration: 1
