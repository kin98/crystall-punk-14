- type: entity
  name: generic rubber stamp
  parent: BaseItem
  id: CE14StampBase
  description: A rubber stamp for stamping important documents.
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "denied_on_paper"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: _CE14/Objects/Bureaucracy/stamp.rsi
    state: denied
  - type: Item
    size: Tiny

- type: entity
  id: CE14StampDenied
  parent: CE14StampBase
  name: denied stamp
  components:
  - type: Stamp
    stampedName: CE14-stamp-denied
    stampedColor: "#b53535"
    stampState: "denied_on_paper"
  - type: Sprite
    state: denied

- type: entity
  id: CE14StampApproved
  parent: CE14StampBase
  name: approved stamp
  components:
  - type: Stamp
    stampedName: CE14-stamp-approved
    stampedColor: "#35b56c"
    stampState: "approved_on_paper"
  - type: Sprite
    state: approved

- type: entity
  id: CE14StampCommandant
  parent: CE14StampBase
  name: commandant stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: CE14-stamp-bank
    stampedColor: "#e8c348"
    stampState: "bank_on_paper"
  - type: Sprite
    state: bank

- type: entity
  id: CE14StampGuardCommander
  parent: CE14StampBase
  name: guard commander stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: CE14-stamp-guard-commander
    stampedColor: "#436a92"
    stampState: "guard_on_paper"
  - type: Sprite
    state: guard

- type: entity
  id: CE14StampGuildmaster
  parent: CE14StampBase
  name: guildmaster stamp
  categories: [ DoNotMap ]
  components:
  - type: Stamp
    stampedName: CE14-stamp-guildmaster
    stampedColor: "#115c41"
    stampState: "guildmaster_on_paper"
  - type: Sprite
    state: guildmaster

