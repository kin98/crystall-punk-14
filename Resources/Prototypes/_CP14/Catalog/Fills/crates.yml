- type: entity
  id: CE14SmallWoodenCrateFilled
  parent:
  - CE14SmallWoodenCrate
  suffix: Filled, Tools and Fluff
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: CE14StationCrateLootTools
        rolls: !type:RangeNumberSelector
          range: 1, 5

- type: entity
  id: CE14LargeWoodenCrateFilled
  suffix: Filled, Tools and Fluff
  parent:
  - CE14LargeWoodenCrate
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: CE14StationCrateLoot

- type: entityTable
  id: CE14StationCrateLoot
  table: !type:AllSelector
    children:
    # Tools
    - !type:NestedSelector
      tableId: CE14StationCrateLootTools
      rolls: !type:RangeNumberSelector
        range: 4, 5
    # Fluff
    - !type:NestedSelector
      tableId: CE14StationCrateLootFluff
      prob: 0.5
      rolls: !type:RangeNumberSelector
        range: 4, 5

- type: entityTable
  id: CE14StationCrateLootTools
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: CE14Screwdriver
        weight: 2
      - id: CE14BaseWrench
        weight: 2
      - id: CE14Scissors
      - id: CE14Torch
      - id: CE14Lighter
      - id: CE14KeyFile
      - id: CE14LockCopper
        weight: 0.3


      - !type:GroupSelector
        children:
        - id: CE14FluteInstrument
        - id: CE14LyraInstrument
        - id: CE14LuteInstrument
        - id: CE14Candle
      - !type:GroupSelector
        children:
        - id: CE14CrystalLampBlueEmpty
        - id: CE14CrystalLampOrangeEmpty
      - id: CE14Rope
      - id: CE14EnergyCrystalMediumEmpty
      - id: CE14BookTieflingGambit
        weight: 0.3 # too often
      - id: CE14d20Dice
      - id: CE14d6Dice
      - id: CE14CopperCoin5
        weight: 0.5
      - !type:NestedSelector
        tableId: CE14RandomVials

- type: entityTable
  id: CE14StationCrateLootFluff
  table: !type:GroupSelector
    children:
    - id: CE14PaperFolderBlue
    - id: CE14PaperFolderRed
    - id: CE14PenFeather
    - id: CE14FoodPotato
    - id: CE14FoodOnion
    - id: CE14Cloth10
    - id: CE14CrayonWhite
    # Cheeese!
    - !type:GroupSelector
      children:
      - id: CE14FoodBlueCheeseWheel
        weight: 0.1
      - id: CE14FoodAgedCheeseWheel
        weight: 0.05
      - id: CE14FoodAgedCheesePart
        weight: 0.3
      - id: CE14FoodBlueCheesePart
        weight: 0.5
      - id: CE14FoodCheeseSlice
      weight: 0.3 # groop chance
    - id: CE14FoodBlueCheeseSlice
      weight: 0.4
    - id: CE14FoodAgedCheeseSlice
      weight: 0.3
    - !type:GroupSelector
      children:
      - id: CE14ClothingCloakGreen
      - id: CE14ClothingCloakWhite
      - id: CE14ClothingCloakFurcapeBlack
      - id: CE14ClothingCloakFurcapeBlue
      - id: CE14ClothingCloakRitualAttireLeather
      - id: CE14ClothingHeadBeretMercenary
      - id: CE14ClothingPantsMercenaryTrousers
      - id: CE14ClothingShirtMercenary
      - id: CE14ClothingShirtYellowWizardDress
    - !type:GroupSelector
      children:
      - id: CE14DyeYellow
      - id: CE14DyeGreen
      - id: CE14DyeRed
      - id: CE14DyePurple
      - id: CE14DyeBlack
      - id: CE14DyeBlue
    - !type:GroupSelector
      children:
      - id: CE14BloodFlower
      - id: CE14AgaricMushroom
      - id: CE14ChromiumSlime
        weight: 0.5
      - id: CE14WildSage
      - id: CE14LumiMushroom
      - id: CE14BlueAmanita
      - id: CE14Dayflin
      - id: CE14AirLily

- type: entityTable
  id: CE14RandomVials
  table: !type:GroupSelector
    children:
    - id: CE14VialSmall
    - id: CE14VialTiny
    - id: CE14GreenBottle
    - id: CE14GreenBottle2
    - id: CE14BlueBottle
    - id: CE14OrangeBottle
    - id: CE14RedBottle

