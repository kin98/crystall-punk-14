- type: biomeTemplate
  id: CE14CavesEmpty
  layers:
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: CE14FloorBase
    - !type:BiomeTileLayer
      tile: CE14FloorCobblestone
      threshold: 0.3
      noise:
        seed: 14
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.2
    - !type:BiomeTileLayer
      tile: CE14FloorDirt
      threshold: 0.3
      noise:
        seed: 18
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 0.1


- type: biomeTemplate
  id: CE14CavesFloor
  layers:
    - !type:BiomeMetaLayer
      template: CE14CavesEmpty
    #Entity
    - !type:BiomeEntityLayer
      threshold: 0.4
      noise:
        seed: 1
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorBase
        - CE14FloorDirt
        - CE14FloorCobblestone
      entities:
        - CE14RockSmall

- type: biomeTemplate
  id: CE14CavesGeneric
  layers:
    - !type:BiomeMetaLayer
      template: CE14CavesFloor
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.75
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CE14FloorBase
        - CE14FloorCobblestone
      entities:
        - CE14WallStone
    - !type:BiomeEntityLayer
      threshold: -0.79
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CE14FloorDirt
      entities:
        - CE14WallDirt
    #Rivers
    - !type:BiomeEntityLayer
      threshold: 0.60
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.05
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      allowedTiles:
        - CE14FloorBase
        - CE14FloorDirt
        - CE14FloorCobblestone
      entities:
        - CE14FloorWater

- type: biomeTemplate
  id: CE14CavesComossResources
  layers:
    - !type:BiomeMetaLayer
      template: CE14CavesFloor
    - !type:BiomeEntityLayer # lumishrooms
      threshold: 0.8
      noise:
        seed: 8
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.045
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
      allowedTiles:
        - CE14FloorBase
        - CE14FloorCobblestone
      entities:
        - CE14GatherableLumiMushroom
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.75
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CE14FloorBase
        - CE14FloorDirt
        - CE14FloorCobblestone
      entities:
        - CE14WallStone
    #Copper
    - !type:BiomeEntityLayer
      threshold: 0.75
      noise:
        seed: 20
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 1.75
      allowedTiles:
        - CE14FloorBase
        - CE14FloorDirt
        - CE14FloorCobblestone
      entities:
        - CE14WallStoneCopperOre

