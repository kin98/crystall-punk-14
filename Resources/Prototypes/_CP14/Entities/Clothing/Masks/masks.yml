- type: entity
  parent: CE14ClothingMaskBase
  id: CE14ClothingMaskBoneMask
  name: bone mask
  description: An enchanted mask formerly belonging to a magical creature.
  components:
  - type: Sprite
    sprite: _CE14/Clothing/Masks/bone_mask.rsi
  - type: Clothing
    sprite: _CE14/Clothing/Masks/bone_mask.rsi
  - type: IdentityBlocker
  - type: AddAccentClothing
    accent: ReplacementAccent
    replacement: CE14skeleton

- type: entity
