- type: entity
  id: CE14PlatePie
  parent: CE14CookerBase
  name: pie plate
  description: A mould for making a delicious pie.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE14/Objects/Consumable/Food/Pies/plate.rsi
    layers:
    - state: iron
    - map: ["CE14_foodLayers"]
    - map: ["enum.StorageFillLayers.Fill"]
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: PhysicalComposition
    materialComposition:
      CE14Iron: 10 # 1 iron bar = 1 plate pie in craft
  - type: CE14FoodCooker
    foodType: Pie
    solutionId: cooker
  - type: CE14FoodHolder
    foodType: Pie
    solutionId: cooker
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
    CE14Ignorelist:
      components:
        - CE14FoodHolder
        - FoodSequenceStartPoint
        - Sharp
        - CE14Sharpened
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 3
    fillBaseName: raw
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 50
  - type: AmbientSound
    sound:
      path: /Audio/_CE14/Ambience/pan_frying.ogg
  - type: GenericVisualizer
    visuals:
      enum.CE14CookingVisuals.Cooking:
        cook:
          True: { visible: true }
          False: { visible: false }
      enum.CE14CookingVisuals.Burning:
        burn:
          True: { visible: true }
          False: { visible: false }
  - type: Edible
    edible: Food
    transferAmount: 2.5
    solution: cooker
    trash: 
    - CE14PlatePie
  - type: Spillable
    solution: cooker
  - type: SolutionContainerVisuals
  - type: SliceableFood