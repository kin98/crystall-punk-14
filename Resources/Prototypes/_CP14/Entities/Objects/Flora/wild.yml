- type: entity
  parent: FoodProduceBase
  id: CE14WildProduceBase
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Tag
    tags:
    - CE14FitInMortar
  - type: BadFood
  - type: Item
    size: Tiny

- type: entity
  id: CE14BloodFlower
  parent: CE14WildProduceBase
  name: blood rose
  description: Scarlet flowers growing where blood has been spilled.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Flora/Wild/red_rose.rsi
    layers:
      - state: base1
        map: ["random"]
  - type: RandomSprite
    available:
    - random:
        base1: ""
        base2: ""
  - type: FlavorProfile
    flavors:
      - CE14Metallic
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: CE14BloodFlowerSap
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 14
        reagents:
        - ReagentId: CE14BloodFlowerSap
          Quantity: 10
  - type: Tag
    tags:
    - CE14FitInMortar
    - CE14AlchemicalHerbals
    - CE14BloodFlower
  - type: Clothing 
    sprite: _CE14/Objects/Flora/Wild/red_rose.rsi
    slots:
    - mask
    - head 
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-flip-verb
    foldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped


- type: entity
  id: CE14AgaricMushroom
  parent: CE14WildProduceBase
  name: fly agaric
  description: This poisonous mushroom can often be found near bodies of water or other wet areas. It is not recommended for consumption.
  components:
