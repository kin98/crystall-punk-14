- type: entity
  parent: BaseItem
  id: CE14FloorTileBase
  description: Makes the floor more pleasant for your feet. And your eyes.
  abstract: true
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _CE14/Objects/Tile/tile.rsi
  - type: Item
    sprite: _CE14/Objects/Tile/tile.rsi
    size: Normal
  - type: Stack
    count: 1
  - type: FloorTile
    placeTileSound:
      collection: CE14Digging #TODO
      params:
        variation: 0.03
        volume: 2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: CE14FloorTileBase
  id: CE14FloorTileFoundation
  name: foundation floor tile
  components:
  - type: Sprite
    state: foundation
  - type: FloorTile
    outputs:
      - CE14FloorFoundation
  - type: Stack
    stackType: CE14FloorTileFoundation
  - type: PhysicalComposition
    materialComposition:
      CE14Stone: 5

