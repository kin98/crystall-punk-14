- type: constructionGraph
  id: CE14SmallWoodenCrate
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CE14SmallWoodenCrate
          completed:
            - !type:SnapToGrid
          steps:
            - stackGroup: WoodenPlanks
              amount: 1
    - node: CE14SmallWoodenCrate
      entity: CE14SmallWoodenCrate
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 2
          completed:
            - !type:SpawnPrototype
              prototype: CE14WoodenPlanks1
              amount: 1

