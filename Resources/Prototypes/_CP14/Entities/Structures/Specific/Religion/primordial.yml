    sprite: _CE14/Structures/Specific/Religion/lumera_statue.rsi
    layers:
    - state: statue1
  - type: CE14ReligionAltar
    religion: Lumera
  - type: CE14ReligionObserver
    religion: Lumera
    radius: 15
  - type: SpawnPoint
    job_id: CE14GodLumera

