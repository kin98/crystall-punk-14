  name: skeleton
  abstract: true
  components:
  - type: CE14NightVision
  - type: NpcFactionMember
    factions:
    - CE14Monster

- type: entity
  id: CE14MobUndeadSkeletonHalberdT1
  parent: CE14MobUndeadSkeletonDemiplaneT1
  categories: [ ForkFiltered ]
  suffix: Halebard T1
  components:
  - type: Loadout
    prototypes:
    - CE14MobSkeletonHalberdT1
  - type: CE14SkillStorage
    skillPoints:
      Memory:
        max: 0 
    #freeLearnedSkills:
    #- SwordMastery
  - type: CE14SpellStorage
    grantAccessToSelf: true
    spells:
    - CE14ActionSpellKick

