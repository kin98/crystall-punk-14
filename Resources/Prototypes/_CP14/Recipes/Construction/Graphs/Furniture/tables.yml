- type: constructionGraph
  id: CE14TableWooden
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CE14TableWoodenFrame
          steps:
            - material: CE14WoodenPlanks
              amount: 1
              doAfter: 1
        - to: CE14TableWoodenBirchFrame
          steps:
          - material: CE14BirchWoodenPlanks
            amount: 1
            doAfter: 1

    - node: CE14TableWoodenFrame
      entity: CE14TableWoodenFrame
      edges:
        - to: start
          steps:
            - tool: Prying
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CE14WoodenPlanks1
              amount: 1
        - to: CE14TableWooden
          steps:
            - material: CE14WoodenPlanks
              amount: 1
              doAfter: 1

    - node: CE14TableWoodenBirchFrame
