- type: entity
  id: CE14ActionSpellPeaceBallade
  parent: CE14ActionSpellBase
  name: Peace ballade
  description: Your music is filled with peaceful magic, forbidding anyone near you to fight.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.8
  - type: CE14ActionManaCost
    manaCost: 2
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 1
  - type: CE14ActionRequiredMusicTool
  - type: CE14ActionDoAfterVisuals
    proto: CE14RunePeaceBallade
  - type: Action
    sound: null
    icon:
      sprite: _CE14/Actions/Spells/healing.rsi
      state: peace_music
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellArea
        range: 4
        maxTargets: 8
        affectCaster: true
        whitelist:
          components:
          - MobState
        effects:
        - !type:CE14SpellSpawnEntityOnTarget
          spawns:
          - CE14ImpactEffectPeaceBallade
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:GenericStatusEffect
            key: Pacified
            component: Pacified
            type: Add
            time: 1.8

- type: entity
  id: CE14ImpactEffectPeaceBallade
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_5
      color: "#bd4fda"
      shader: unshaded

- type: entity
  id: CE14RunePeaceBallade
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#bd4fda"
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_3
      color: "#bd4fda"
      shader: unshaded

