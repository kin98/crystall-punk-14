- type: entity
  id: CE14ActionSpellFirewave
  parent: CE14ActionSpellBase
  name: Firewave
  description: You release a wave of hot fire that strikes multiple targets in an area.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.75
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionSpeaking
    endSpeech: "Ignis acus!"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneFirebolt
  - type: CE14ActionDangerous
  - type: DoAfterArgs
    delay: 0.5
  - type: Action
    useDelay: 1
    icon:
      sprite: _CE14/Actions/Spells/fire.rsi
      state: firewave
  - type: TargetAction
    repeat: true
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      effects:
      - !type:CE14SpellProjectile
        prototype: CE14Firebolt
        spread: 2
        projectileSpeed: 5
        projectileCount: 8

- type: entity
  id: CE14RuneFirebolt
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    layers:
    - state: medium_circle
      color: "#fdda5d"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectFirebolt
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/fire.rsi
    layers:
    - state: small
      visible: false
      map: ["enum.EffectLayers.Unshaded"]
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 2.0
  - type: LightFade

- type: entity
  id: CE14Firebolt
  parent: BaseBullet
  name: firebolt
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: SpawnOnDespawn
    prototype: CE14ImpactEffectFirebolt
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 2.0
  - type: Projectile
    impactEffect: CE14ImpactEffectFirebolt
    damage:
      types:
        Heat: 2
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_metal1.ogg
  - type: Sprite
    sprite: _CE14/Effects/fire.rsi
    layers:
    - state: small
      shader: unshaded


- type: entity
  parent: CE14BaseSpellScrollFire
  id: CE14SpellScrollFirewave
  name: firewave spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellFirewave

