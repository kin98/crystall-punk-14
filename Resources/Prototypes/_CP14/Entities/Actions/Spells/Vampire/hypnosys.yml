- type: entity
  id: CE14ActionSpellVampireHypnosys
  parent: CE14ActionSpellBase
  name: Hypnosys
  description: You focus on the target, mesmerizing and lulling it to sleep.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.4
  - type: CE14MagicEffectVampire
  - type: CE14ActionManaCost
    manaCost: 5
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneVampireHypnosis
  - type: DoAfterArgs
    delay: 3
    breakOnMove: true
  - type: Action
    useDelay: 120
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: blood_moon
  - type: TargetAction
    range: 3
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectVampireHypnosis
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:ModifyStatusEffect
          effectProto: CE14StatusEffectVampireForceSleep
          type: Add
          time: 4
          refresh: true

- type: entity
  id: CE14RuneVampireHypnosis
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: red
  - type: Sprite
    layers:
    - state: double_outer
      color: red
      shader: unshaded

- type: entity
  id: CE14ImpactEffectVampireHypnosis
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: Effects/electricity.rsi
    layers:
    - state: electrified
      color: red
      shader: unshaded
