- type: biomeTemplate
  id: CE14CavesMushroomFloor
  layers:
    - !type:BiomeMetaLayer
      template: CE14CavesFloor
    - !type:BiomeTileLayer
      tile: CE14FloorMycelium
      threshold: 0
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120
    - !type:BiomeTileLayer
      tile: CE14FloorMyceliumLight
      threshold: 0.45
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: Ridged
        frequency: 0.05
        octaves: 3
        lacunarity: 1.8
        gain: 0.7
        domainWarpType: OpenSimplex2
        domainWarpAmp: 120

- type: biomeTemplate
  id: CE14CavesMushroom
  layers:
    - !type:BiomeMetaLayer
      template: CE14CavesMushroomFloor
    #Walls
    - !type:BiomeEntityLayer
      threshold: -0.75
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CE14FloorBase
        - CE14FloorMycelium
        - CE14FloorMyceliumLight
        - CE14FloorCobblestone
      entities:
        - CE14WallStone
    - !type:BiomeEntityLayer
      threshold: -0.79
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5
      allowedTiles:
        - CE14FloorDirt
      entities:
        - CE14WallDirt
      #Mazy mini tunenls
    - !type:BiomeEntityLayer
      threshold: 0.40
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.13
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      allowedTiles:
        - CE14FloorBase
        - CE14FloorMycelium
        - CE14FloorMyceliumLight
        - CE14FloorCobblestone
      entities:
        - CE14RoofRemover #Lol, i just wanna air here. TODO: fix
     # Rare Trees
    - !type:BiomeEntityLayer
      threshold: 0.8
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - CE14FloorMycelium
        - CE14FloorMyceliumLight
      entities:
        - CE14MushroomTree1
        - CE14MushroomTree2
        - CE14MushroomTree3
        - CE14MushroomTree4

# Subbiomes

