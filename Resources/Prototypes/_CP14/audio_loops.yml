
- type: ambientLoop
  id: OpenWinds
  sound:
    params:
      volume: -6
    collection: CE14LoopWinds
  rules: OpenWinds

- type: ambientLoop
  id: Water
  sound:
    params:
      volume: 18
    collection: CE14LoopWater
  rules: NearWater

- type: ambientLoop
  id: Lurker
  sound:
    params:
      volume: -12
    path: /Audio/_CE14/Effects/Lurker/ambient.ogg
  rules: NearLurker

- type: ambientLoop
  id: Cave
  sound:
    params:
      volume: 2
    collection: CE14LoopCave
  rules: CaveFloor

- type: ambientLoop
  id: NightGrass
  sound:
    params:
      volume: 2
    collection: CE14LoopNightGrass
  rules: GrassNight

- type: ambientLoop
  id: ForestDay
  sound:
    params:
      volume: 2
    collection: CE14LoopForestDay
  rules: DayForest

# Sound collections
- type: soundCollection
  id: CE14LoopWinds
  files:
    - /Audio/_CE14/Ambience/Loops/winds.ogg

- type: soundCollection
  id: CE14LoopWater
  files:
    - /Audio/_CE14/Ambience/Loops/water.ogg

- type: soundCollection
  id: CE14LoopCave
  files:
    - /Audio/_CE14/Ambience/Loops/cave.ogg

- type: soundCollection
  id: CE14LoopNightGrass
  files:
    - /Audio/_CE14/Ambience/Loops/ambiforest_night.ogg

- type: soundCollection
  id: CE14LoopForestDay
  files:
    - /Audio/_CE14/Ambience/Loops/ambiforest_day.ogg

# Rules
- type: rules
  id: OpenWinds
  rules:
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - CE14FloorGrass
      - CE14FloorGrassLight
      - CE14FloorGrassTall
      - CE14FloorDirt
      - CE14FloorSand
      range: 5

- type: rules
  id: GrassNight
  rules:
    - !type:CE14IsNight
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - CE14FloorGrass
      - CE14FloorGrassLight
      - CE14FloorGrassTall
      range: 5

- type: rules
  id: DayForest
  rules:
    - !type:CE14IsNight
      inverted: true
    - !type:NearbyEntitiesRule
      count: 3
      whitelist:
        tags:
          - CE14AmbientForest

- type: rules
  id: CaveFloor
  rules:
    - !type:NearbyTilesPercentRule
      ignoreAnchored: true
      percent: 0.5
      tiles:
      - CE14FloorBase
      range: 5

- type: rules
  id: NearWater
  rules:
    - !type:NearbyEntitiesRule
      count: 5
      whitelist:
        tags:
          - CE14AmbientWater
      range: 4

- type: rules
  id: NearLurker
  rules:
    - !type:NearbyEntitiesRule
      count: 1
      whitelist:
        tags:
          - CE14AmbientLurker
      range: 6

