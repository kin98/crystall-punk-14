- type: entity
  id: CE14WallmountButtonBase
  abstract: true
  parent:
  - CE14BaseWallmount
  categories: [ ForkFiltered ]
  name: wall button
  description: This button can activate something!
  components:
  - type: Sprite
    sprite: _CE14/Structures/Specific/Device/wallmount_buttons.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: UseDelay
    delay: 0.5 # prevent light-toggling auto-clickers.
  - type: SignalSwitch
    onPort: CE14Pressed
    offPort: CE14Pressed
    statusPort: CE14Pressed
  - type: Fixtures
  - type: DeviceNetwork
    deviceNetId: Wireless
  - type: WirelessNetworkConnection
    range: 10
  - type: DeviceLinkSource
    ports:
      - CE14Pressed

- type: entity
  id: CE14WallmouontButtonWooden
  parent: CE14WallmountButtonBase
  components:
  - type: Sprite
    state: wooden

- type: entity
  id: CE14WallmouontButtonStone
  parent: CE14WallmountButtonBase
  components:
  - type: Sprite
    state: stone

