- type: species
  id: CE14Tiefling
  name: CE14-species-name-tiefling
  roundStart: true
  prototype: CE14MobTiefling
  sprites: CE14MobTieflingSprites
  markingLimits: CE14MobTieflingMarkingLimits
  dollPrototype: CE14MobTieflingDummy
  skinColoration: CE14TieflingHues
  maleFirstNames: CE14_Names_Tiefling_Male_First
  femaleFirstNames: CE14_Names_Tiefling_Female_First
  lastNames: CE14_Names_Tiefling_Last

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: CE14MobTieflingSprites
  sprites:
    Head: CE14MobTieflingHead
    HeadTop: CE14MobTieflingAnyMarking
    Hair: CE14MobTieflingAnyMarking
    FacialHair: CE14MobTieflingAnyMarking
    Snout: CE14MobTieflingMarkingMatchSkin
    Tail: CE14MobTieflingMarkingMatchSkin
    Chest: CE14MobTieflingTorso
    Eyes: CE14MobTieflingEyes
    LArm: CE14MobTieflingLArm
    RArm: CE14MobTieflingRArm
    LHand: CE14MobTieflingLHand
    RHand: CE14MobTieflingRHand
    LLeg: CE14MobTieflingLLeg
    RLeg: CE14MobTieflingRLeg
    LFoot: CE14MobTieflingLFoot
    RFoot: CE14MobTieflingRFoot

- type: markingPoints
  id: CE14MobTieflingMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ CE14TieflingTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ CE14TieflingHorns ]
    Chest:
      points: 1
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

