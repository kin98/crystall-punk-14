- type: entity
  id: CE14ActionSpellLightningStrike
  parent: CE14ActionSpellBase
  name: Lightning strike
  description: You charge a powerful lightning bolt that burns a large amount of stamina from the target.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 20
  - type: CE14ActionSpeaking
    startSpeech: "A fulgur percutiens... "
    endSpeech: "erit ledo vobis!"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneLightningStrike
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 10
    icon:
      sprite: _CE14/Actions/Spells/electromancy.rsi
      state: lightning_strike
  - type: TargetAction
    range: 5
  - type: DoAfterArgs
    delay: 2
    breakOnDamage: true
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CE14EntityTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ElectrifiedEffect
      - !type:CE14SpellCreateBeam
        beamProto: CE14LightningStrikeBeam
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          ignoreResistances: false
          damage:
            types:
              Shock: 12
        - !type:Jitter
        - !type:CE14StaminaChange
          staminaDelta: -80
      - !type:CE14SpellThrowFromUser
        throwPower: 4
        distance: 1

- type: entity
  name: lightning
  id: CE14LightningStrikeBeam
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_CE14/Effects/Beams/lightning.rsi
    drawdepth: Effects
    layers:
    - state: lightning
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: PointLight
    enabled: true
    color: "#e8ff4c"
    radius: 1.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/lightningshock.ogg
  - type: TimedDespawn
    lifetime: 1.5
  - type: LightFade
    duration: 1.5
  - type: Tag
    tags:
      - HideContextMenu
  - type: CE14SpellEffectOnCollide
    effects:
    - !type:CE14SpellSpawnEntityOnTarget
      spawns:
      - CE14ElectrifiedEffect
    - !type:CE14SpellApplyEntityEffect
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Shock: 10
      - !type:Jitter
      - !type:CE14StaminaChange
        staminaDelta: -30

- type: entity
  id: CE14RuneLightningStrike
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#e8ff4c"
  - type: Sprite
    layers:
    - state: medium_circle
      color: "#e8ff4c"
      shader: unshaded
