- type: constructionGraph
  id: CE14WoodenChest
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CE14WoodenChest
          steps:
            - material: CE14WoodenPlanks
              amount: 5
              doAfter: 2
            - material: CE14IronBar
              amount: 1
              doAfter: 2

    - node: CE14WoodenChest
      entity: CE14WoodenChest
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CE14WoodenPlanks1
              amount: 2
            - !type:SpawnPrototype
              prototype: CE14IronBar1
              amount: 1
          conditions:
          - !type:Locked
            locked: false
          steps:
            - tool: Screwing
              doAfter: 1
            - tool: Prying
              doAfter: 3

