- type: entity
  abstract: true
  id: CE14BaseWeaponSpear
  parent:
  - BaseItem
  - CE14BaseWeaponChemical
  - CE14BaseWeaponDestructible
  - CE14BaseWeaponSelfDamage
  - CE14BaseWeaponSharp
  - CE14BaseWeaponThrowable
  components:
  - type: Item
    size: Ginormous
  - type: ThrowingAngle
    angle: -90
  - type: EmbeddableProjectile
    offset: -0.15,-0.15
    removalTime: 1.5
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 16
  - type: MeleeWeapon
    attackRate: 0.5
    range: 2.75
    angle: 10 #Lower in 4 times
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 8
    animation: CE14WeaponArcThrust
    wideAnimation: CE14WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    cPAnimationLength: 0.3
    cPAnimationOffset: 2
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 5
  - type: CE14BonusDistanceMeleeDamage
    minDistance: 2.25
    bonusDamage:
      types:
        Piercing: 6
  - type: Wieldable
  - type: Clothing
    slots:
    - neck
    breakOnMove: false
    equipDelay: 1
    unequipDelay: 1

- type: entity
  parent: CE14BaseWeaponSpear
  id: CE14WeaponSpearIron
  name: iron spear
  description: A reliable spear that is standard in the Zellasian Empire. It strikes far, but slowly.
  components:
  - type: Sprite
    sprite: _CE14/Objects/Weapons/Melee/Spear/iron.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 20
      CE14Iron: 10
