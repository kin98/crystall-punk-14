
# Splitting: Applying magical dispel to split precursor into essences.

- type: reaction
  id: CE14GroundQuartzSplitting
  requiredMixerCategories:
  - CE14MagicSplitting
  reactants:
    CE14GroundQuartz:
      amount: 1
  products:
    CE14EssenceCrystal: 0.5
