- type: entity
  id: CE14ActionSpellFlashLight
  parent: CE14ActionSpellBase
  name: Flash Light
  description: Creates a flash of bright, blinding light.
  components:
  - type: CE14ActionManaCost
    manaCost: 10
  - type: CE14ActionSpeaking
    startSpeech: "Lux clara..."
    endSpeech: "excaecant inimicos meos"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneFlashLight
  - type: DoAfterArgs
    delay: 0.5
    breakOnDamage: true
  - type: Action
    useDelay: 6
    icon:
      sprite: _CE14/Actions/Spells/light.rsi
      state: flash_light
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectFlashLight
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14SpawnEffectFlashLight

- type: entity
  id: CE14RuneFlashLight
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#efedff"
  - type: Sprite
    layers:
    - state: sun
      color: "#efedff"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectFlashLight
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#efedff"
      shader: unshaded

- type: entity
  id: CE14SpawnEffectFlashLight
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: /Textures/Objects/Fun/goldbikehorn.rsi
    visible: false
    state: icon
  - type: TriggerOnSpawn
  - type: TimedDespawn
    lifetime: 5
  - type: FlashOnTrigger
    range: 4
    duration: 4
  - type: SpawnOnTrigger
    proto: CE14SpellFlashEffect

- type: entity
  id: CE14SpellFlashEffect
  categories: [ HideSpawnMenu ]
  save: false
  components:
    - type: PointLight
      enabled: true
      radius: 5
      energy: 14
      netsync: false
    - type: LightFade
      duration: 0.5
    - type: TimedDespawn
      lifetime: 0.5

- type: entity
  parent: CE14BaseSpellScrollLight
  id: CE14SpellScrollFlashLight
  name: flash light spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellFlashLight

