- type: entity
  id: CE14PlateBase
  parent: BaseItem
  description: This is your plate for a delicious meal!
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _CE14/Objects/Consumable/Food/Meals/plates.rsi
  - type: Item
    shape:
    - 0,0,1,0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
  - type: CE14FoodHolder
    displacementRsiPath: _CE14/Objects/Consumable/Food/Meals/displacement.rsi
    foodType: Meal
    solutionId: food
    canAcceptFood: true
  - type: Appearance
  - type: SolutionContainerVisuals
  - type: Edible
    transferAmount: 2.5
  - type: Spillable
    solution: food

- type: entity
  id: CE14PlateWooden
  parent: CE14PlateBase
  name: wooden plate
  components:
  - type: Sprite
    layers:
    - state: wooden
    - map: ["CE14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CE14WoodenPlanks: 20
  - type: Food
    trash: 
    - CE14PlateWooden

- type: entity
  id: CE14PlateIron
  parent: CE14PlateBase
  name: iron plate
  components:
  - type: Sprite
    layers:
    - state: iron
    - map: ["CE14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CE14Iron: 10
  - type: Food
    trash: 
    - CE14PlateIron

- type: entity
  id: CE14PlateGold
  parent: CE14PlateBase
  name: gold plate
  components:
  - type: Sprite
    layers:
    - state: gold
    - map: ["CE14_foodLayers"]
  - type: PhysicalComposition
    materialComposition:
      CE14Gold: 10
  - type: Food
    trash: 
    - CE14PlateGold