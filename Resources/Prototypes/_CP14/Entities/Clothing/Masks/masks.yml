- type: entity
  parent: CE14ClothingMaskBoneMask
  id: CE14ClothingMaskBoneMaskMind
  categories: [ HideSpawnMenu ]
  components:
  - type: BlockMovement
  - type: Actions
  - type: Emoting
  - type: DoAfter
  - type: SkeletonAccent
  - type: Speech
    speechVerb: Skeleton
  - type: Vocal
    sounds:
      Male: Skeleton
      Female: Skeleton
      Unsexed: Skeleton
  - type: Organ
  - type: Brain
  - type: Tag
    tags:
      - MindTransferTarget
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: CE14ClothingMaskBoneMask
      amount: 1

