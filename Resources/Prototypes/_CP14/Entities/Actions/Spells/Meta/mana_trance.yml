- type: entity
  id: CE14ActionSpellManaTrance
  parent: CE14ActionSpellBase
  name: Mana trance
  description: You go into a trance for a while, restoring mana.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.05
  - type: DoAfterArgs
    repeat: true
    delay: 1
    hidden: true
    breakOnDamage: true
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneManaTrance
  - type: Action
    useDelay: 60
    icon:
      sprite: _CE14/Actions/Spells/meta.rsi
      state: mana_trance
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectManaGift
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:CE14ManaChange
          manaDelta: 2
          safe: true
        - !type:HealthChange
          damage:
            types:
              CE14ManaDepletion: -0.1

- type: entity
  id: CE14RuneManaTrance
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5096d4"
  - type: Sprite
    layers:
    - state: sun
      color: "#5096d4"
      shader: unshaded

