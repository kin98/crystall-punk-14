- type: entity
  id: CE14MobSlimeElectric
  parent: CE14MobSlimeBase
  name: electric slime
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: base
      color: "#f7f00c"
      shader: unshaded
  - type: PointLight
    color: "#f7f00c"
    energy: 2
    radius: 1.8
  - type: SolutionContainerManager
    solutions:
      slime:
        maxVol: 50
        reagents:
        - ReagentId: CE14ChromiumSlime
          Quantity: 20
        - ReagentId: CE14EssenceEnergia
          Quantity: 30
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3
        Shock: 3
  - type: CE14SpellEffectOnHit
    effects:
    - !type:CE14SpellApplyEntityEffect
      effects:
      - !type:Jitter
      - !type:CE14StaminaChange
        staminaDelta: -10
    - !type:CE14SpellSpawnEntityOnTarget
      spawns:
      - CE14ElectrifiedEffect
  - type: Damageable
    damageModifierSet: CE14SlimeElectric
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:SpillBehavior
        solution: slime
      - !type:SpawnEntitiesBehavior
        spawn:
            CE14AreaEntityEffectSlimeShock:
              min: 1
              max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:GroupSelector
          children:
          - id: CE14OreCopper1
          - id: CE14OreIron1
          - id: CE14ScrapCopper
          - id: CE14ScrapIron
          - id: CE14CopperCoin1
            weight: 3

- type: entity
  id: CE14AreaEntityEffectSlimeShock
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#f7f00c"
  - type: Sprite
    noRot: true
    drawdepth: BelowFloor
    sprite: _CE14/Effects/Magic/area_impact.rsi
    layers:
    - state: area_impact_out
      color: "#f7f00c"
      scale: 2, 2
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.2
  - type: CE14AreaEntityEffect
    range: 2
    whitelist:
      components:
      - Damageable
    effects:
    - !type:CE14SpellSpawnEntityOnTarget
      spawns:
      - CE14ElectrifiedEffect
    - !type:CE14SpellApplyEntityEffect
      effects:
      - !type:Jitter
      - !type:CE14StaminaChange
        staminaDelta: -30
