- type: entity
  id: CE14ActionSpellVampireCureWounds
  parent: CE14ActionSpellBase
  name: Cure blood
  description: You heal the target from any kind of damage.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 12
  - type: CE14MagicEffectVampire
  - type: CE14ActionSkillPointCost
    skillPoint: Blood
    count: 0.1
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneVampireHypnosis
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/vampire.rsi
      state: wound_heal
  - type: TargetAction
    range: 7
    interactOnMiss: false
  - type: DoAfterArgs
    delay: 1.5
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodEssence
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectBloodEssence
      - !type:CE14SpellApplyEntityEffect
        effects:
        - !type:HealthChange
          damage:
            types:
              Slash: -15
              Blunt: -15
              Piercing: -15
              Poison: -15
              Bloodloss: -15
              Caustic: -15
              Cold: -15
              Heat: -15
              Shock: -15
        - !type:Jitter
        - !type:ModifyBleedAmount
          amount: -25