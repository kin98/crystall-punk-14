- type: entity
  id: CE14ActionSpellFireball
  parent: CE14ActionSpellBase
  name: Fireball
  description: An effective method of destruction - an explosive fireball
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.3
  - type: CE14ActionManaCost
    manaCost: 20
  - type: CE14ActionSpeaking
    startSpeech: "Quaeso, quemdam inter vos quaero... "
    endSpeech: "A pila!"
  - type: CE14ActionFreeHandsRequired
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneFireball
  - type: CE14ActionDangerous
  - type: DoAfterArgs
    delay: 2.5
  - type: Action
    useDelay: 25
    icon:
      sprite: _CE14/Actions/Spells/fire.rsi
      state: fireball
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      effects:
      - !type:CE14SpellSpawnEntityOnUser
        spawns:
        - CE14ImpactEffectFireball
      - !type:CE14SpellProjectile
        prototype: CE14Fireball

- type: entity
  id: CE14RuneFireball
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#eea911"
  - type: Sprite
    layers:
    - state: sun
      color: "#eea911"
      shader: unshaded
    - state: medium_circle
      color: "#fdda5d"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectFireball
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: wave_up
      color: "#eea911"
      shader: unshaded

- type: entity
  id: CE14Fireball
  parent: BulletRocket
  name: fireball
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 10
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.35
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 15
    intensitySlope: 1
    maxIntensity: 6
    canCreateVacuum: false

- type: entity
  parent: CE14BaseSpellScrollFire
  id: CE14SpellScrollFireball
  name: fireball spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellFireball

