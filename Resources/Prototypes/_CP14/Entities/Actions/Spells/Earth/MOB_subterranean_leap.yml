- type: entity
  id: CE14ActionMoleSpellSubterraneanLeap
  name: Subterranean leap
  description: Make a subterranean leap, quickly approaching the victim.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: -1.0
  - type: CE14ActionManaCost
    manaCost: 5
  - type: CE14ActionDoAfterVisuals
    proto: CE14ImpactEffectDigging
  - type: Action
    useDelay: 8
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/gib3.ogg
    icon:
      sprite: _CE14/Actions/Spells/earth.rsi
      state: subterranean_leap
  - type: DoAfterArgs
    breakOnMove: false
    breakOnDamage: false
    hidden: true
    delay: 0.5
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectDigging
      effects:
      - !type:CE14SpellCasterTeleport
        needVision: false
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectDigging

- type: entity
  id: CE14ImpactEffectDigging
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/material_splash.rsi
    layers:
    - state: dirt1

