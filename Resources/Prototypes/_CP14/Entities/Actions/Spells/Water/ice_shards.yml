- type: entity
  id: CE14ActionSpellIceShards
  parent: CE14ActionSpellBase
  name: Ice Shards
  description: Fast ice needles, for rapid shooting of targets.
  components:
  - type: Sprite
    sprite: _CE14/Actions/Spells/water.rsi
    state: ice_shards
  - type: CE14ActionManaCost
    manaCost: 5
  - type: CE14ActionSpeaking
    endSpeech: "Glacies acus!"
  - type: CE14ActionDangerous
  - type: Action
    useDelay: 0.5
    icon:
      sprite: _CE14/Actions/Spells/water.rsi
      state: ice_shards
  - type: TargetAction
    repeat: true
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      effects:
      - !type:CE14SpellProjectile
        prototype: CE14IceShard
      - !type:CE14SpellSpawnEntityOnUser
        spawns:
        - CE14ImpactEffectWaterCreation

- type: entity
  id: CE14RuneIceShards
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5eabeb"
  - type: Sprite
    layers:
    - state: double_outer
      color: "#5eabeb"
      shader: unshaded

- type: entity
  id: CE14IceShard
  parent: BaseBullet
  name: ice shard
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#5eabeb"
    radius: 1.1
    energy: 1.0
  - type: Projectile
    damage:
      types:
        Cold: 5
        Piercing: 2.5
  - type: Sprite
    sprite: _CE14/Effects/Magic/ice_shard.rsi
    layers:
    - state: shard
      shader: unshaded

- type: entity
  parent: CE14BaseSpellScrollWater
  id: CE14SpellScrollIceShards
  name: ice shards spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellIceShards
