        - material: CE14BirchWoodenPlanks
          amount: 1
          doAfter: 1

    - node: CE14TableWooden
      entity: CE14TableWooden
      edges:
        - to: CE14TableWoodenFrame
          steps:
            - tool: Prying
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CE14WoodenPlanks1
              amount: 1
        - to: CE14TableWoodenCounter
          steps:
            - material: CE14WoodenPlanks
              amount: 1
              doAfter: 1

    - node: CE14TableWoodenBirch
      entity: CE14TableWoodenBirch
      edges:
      - to: CE14TableWoodenBirchFrame
        steps:
        - tool: Prying
          doAfter: 1
        completed:
        - !type:SpawnPrototype
          prototype: CE14BirchWoodenPlanks1
          amount: 1
      - to: CE14TableWoodenBirchCounter
        steps:
        - material: CE14BirchWoodenPlanks
          amount: 1
          doAfter: 1

    - node: CE14TableWoodenCounter
      entity: CE14TableWoodenCounter
      edges:
        - to: CE14TableWooden
          steps:
            - tool: Prying
              doAfter: 1
          completed:
            - !type:SpawnPrototype
              prototype: CE14WoodenPlanks1
              amount: 1

    - node: CE14TableWoodenBirchCounter
      entity: CE14TableWoodenBirchCounter
      edges:
      - to: CE14TableWoodenBirch
        steps:
        - tool: Prying
          doAfter: 1
