- type: entity
  id: CE14ActionSpellShadowGrab
  parent: CE14ActionSpellBase
  name: Shadow grab
  description: You attract a ghostly hand that draws an object or entity to you
  components:
  - type: CE14ActionManaCost
    manaCost: 20
  - type: CE14ActionFreeHandsRequired
  - type: Action
    useDelay: 5
    icon:
      sprite: _CE14/Actions/Spells/dimension.rsi
      state: shadow_grab
  - type: DoAfterArgs
    breakOnHandChange: false
    delay: 0.5
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    whitelist:
      components:
      - Item
    canTargetSelf: false
    event: !type:CE14EntityTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectShadowStep
      - !type:CE14SpellSpawnEntityOnUser
        spawns:
        - CE14ImpactEffectShadowGrab
      effects:
      - !type:CE14SpellThrowToUser
        throwPower: 10
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectShadowStep

- type: entity
  id: CE14ImpactEffectShadowGrab
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#5e427e"

- type: entity
  parent: CE14BaseSpellScrollDimension
  id: CE14SpellScrollShadowGrab
  name: shadow grab spell scroll
  components:
  - type: CE14SpellStorage
    spells:
    - CE14ActionSpellShadowGrab
