- type: entity
  id: CE14ActionSpellSpeedBallade
  parent: CE14ActionSpellBase
  name: Speed ballade
  description: Your music is filled with accelerating magic, speeding up the movement of all creatures nearby
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 1
  - type: CE14ActionManaCost
    manaCost: 1
  - type: DoAfterArgs
    hidden: true
    repeat: true
    delay: 1
  - type: CE14ActionRequiredMusicTool
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneSpeedBallade
  - type: Action
    useDelay: 15
    icon:
      sprite: _CE14/Actions/Spells/electromancy.rsi
      state: speed_music
  - type: InstantAction
    event: !type:CE14InstantModularEffectEvent
      effects:
      - !type:CE14SpellArea
        affectCaster: true
        range: 5
        maxTargets: 4
        whitelist:
          components:
          - MobState
        effects:
        - !type:CE14SpellSpawnEntityOnTarget
          spawns:
          - CE14ImpactEffectSpeedBallade
        - !type:CE14SpellApplyEntityEffect
          effects:
          - !type:MovespeedModifier
            walkSpeedModifier: 1.2
            sprintSpeedModifier: 1.2
            statusLifetime: 1.8

- type: entity
  id: CE14ImpactEffectSpeedBallade
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_5
      color: "#e8cb56"
      shader: unshaded

- type: entity
  id: CE14RuneSpeedBallade
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#e8cb56"
  - type: Sprite
    sprite: _CE14/Effects/music.rsi
    layers:
    - state: notes_3
      color: "#e8cb56"
      shader: unshaded

