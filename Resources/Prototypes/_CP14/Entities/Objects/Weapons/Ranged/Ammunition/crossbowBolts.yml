- type: entity
  id: CE14CrossboltIron
  parent: CE14BaseCrossbolt
  name: iron crossbow bolt
  description: Rod with a pointed spike in iron. No plumage, they're not bows.
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: Sprite
    layers:
    - state: rod
    - state: solution1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: PhysicalComposition
    materialComposition:
      CE14Iron: 2

