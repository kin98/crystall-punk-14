- type: entity
  id: CE14WindowStoneBrick
  parent: CE14WindowBase
  name: stone brick window
  description: A stone brick wall with a glass window in it.
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/stone_bricks_window.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/stone_bricks_window.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14GlassShard:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ChangeConstructionNodeBehavior
        node: CE14WindowStoneBrickBroken
  - type: Construction
    graph: CE14WindowStoneBrick
    node: CE14WindowStoneBrick

- type: entity
  id: CE14WindowFrameStoneBrick
  name: stone brick window frame
  parent: CE14BaseWindowFrame
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/stone_bricks_window_frame.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/stone_bricks_window_frame.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: CE14RockStructural
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CE14StoneBlock1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CE14WindowStoneBrick
    node: CE14WindowFrameStoneBrick

- type: entity
  id: CE14WindowStoneBrickBroken
  name: shattered stone brick window
  parent:
  - CE14BaseWindowFrameBroken
  - CE14WindowFrameStoneBrick
  components:
  - type: Sprite
    sprite: _CE14/Structures/Windows/stone_bricks_window_broken.rsi
  - type: Icon
    sprite: _CE14/Structures/Windows/stone_bricks_window_broken.rsi
  - type: Construction
    graph: CE14WindowStoneBrick
    node: CE14WindowStoneBrickBroken
