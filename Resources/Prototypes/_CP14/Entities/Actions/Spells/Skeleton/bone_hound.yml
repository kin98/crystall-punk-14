- type: entity
  id: CE14ActionSpellCallBoneHound
  parent: CE14ActionSpellBase
  name: Call of the Bone hound
  description: The spell creates a bloodthirsty bone hound from bones. With luck, it may even gain a mind as cunning as your own.
  components:
  - type: CE14ActionDoAfterSlowdown
    speedMultiplier: 0.5
  - type: CE14ActionManaCost
    manaCost: 50
  - type: CE14ActionMaterialCost
    requirement: !type:StackResource
      stack: CE14Bone
      count: 10
  - type: CE14ActionSpeaking
    startSpeech: "Ossa mortuorum..."
    endSpeech: "incipiunt mihi quasi canis canis servire"
  - type: CE14ActionDoAfterVisuals
    proto: CE14RuneCallBoneHound
  - type: DoAfterArgs
    delay: 5
  - type: Action
    useDelay: 20
    icon:
      sprite: _CE14/Actions/Spells/skeleton.rsi
      state: bone_hound
  - type: LimitedCharges
    maxCharges: 3
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:CE14WorldTargetModularEffectEvent
      telegraphyEffects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14ImpactEffectCallBoneHound
      effects:
      - !type:CE14SpellSpawnEntityOnTarget
        spawns:
        - CE14MobMonsterBoneHound

- type: entity
  id: CE14RuneCallBoneHound
  parent: CE14BaseMagicRune
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: PointLight
    color: "#ae9c86"
  - type: Sprite
    layers:
    - state: medium_line
      color: "#ae9c86"
      shader: unshaded
    - state: medium_circle
      color: "#ae9c86"
      shader: unshaded

- type: entity
  id: CE14ImpactEffectCallBoneHound
  parent: CE14BaseMagicImpact
  categories: [ HideSpawnMenu ]
  save: false
  components:
  - type: Sprite
    layers:
    - state: particles_up
      color: "#ae9c86"
      shader: unshaded
    - sprite: _CE14/Effects/Magic/cast_rune.rsi
      state: medium_circle
      color: "#ae9c86"
      shader: unshaded
