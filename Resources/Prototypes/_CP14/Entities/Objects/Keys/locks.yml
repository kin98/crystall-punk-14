- type: entity
  parent: BaseItem
  id: CE14BaseLock
  abstract: true
  categories: [ ForkFiltered ]
  name: lock
  description: A small device customized only for a specific key shape. Attach it to doors or chests that have no lock and feel the spirit of security.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _CE14/Objects/keys.rsi
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
      params:
        variation: 0.05
  - type: CE14Lock
    canEmbedded: true

- type: entity
  parent: CE14BaseLock
  id: CE14LockCopper
  components:
  - type: Sprite
    state: lock_copper
  - type: CE14Lock
    lockShape:
    - 2
    - 2
    - 2
  - type: PhysicalComposition
    materialComposition:
      CE14Copper: 10

